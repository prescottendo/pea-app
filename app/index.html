<style>
  /* Practice classic: navy header with the logo, cream page, white cards. Phones get a bottom tab bar. */
  :root {
    --ts:1; /* text size from Settings: every font size is multiplied by it */
    /* Type scale (TY-2). Use these, never a one-off size: Large Title 26 (page titles, big numbers), Title 20 (panel,
       step and in-content titles, empty states), Body/Headline 16 (text, inputs, buttons and row titles at 600),
       Subhead 14 (meta lines, notes, chips, links, toasts), Caption 12 (section labels, tags, badges, tab labels),
       Display 56 (the one running timer). Two weights (400, 600); line heights 1.15 / 1.35 / 1.45;
       radii 8 / 12 / 18 / pill; spacing 4, 8, 12, 16, 24, 32. */
    --fs-large:calc(26px * var(--ts)); --fs-title:calc(20px * var(--ts)); --fs-body:calc(16px * var(--ts));
    --fs-sub:calc(14px * var(--ts)); --fs-cap:calc(12px * var(--ts)); --fs-display:calc(56px * var(--ts)); --fs-timer:calc(42px * var(--ts));
    /* PEA style guide: Deep Navy #0A345A, White, Dark Gray #333333, Gray #808080, Light Gray #D3D3D3,
       Beige 1 #BDB7AB, Beige 2 #EBE6D9, Metallic Gold #C6A85C, Metallic Silver #C4C8CC. */
    --header:#0A345A; --header-ink:#FFFFFF; --header-muted:#C4C8CC;
    --page:#EBE6D9; --card:#FFFFFF; --field:#FFFFFF; --ink:#333333; --muted:#5F5F5F; --line:#D3D3D3; --line-soft:rgba(189,183,171,.28);
    --heading:#0A345A; --primary:#0A345A; --primary-ink:#FFFFFF; --link:#0A345A;
    --gold:#C6A85C; --gold-ink:#6B5418; --gold-soft:#FCFAF4;
    --avatar:#0A345A; --avatar-ink:#FFFFFF; --bubble:#E1E8F0; --bubble-ink:#0A345A;
    --red:#B3261E; --red-soft:#FBE9E7; --green:#2E7D4F; --green-soft:#DCEFE2; --on-green:#FFFFFF;
    --st-not-bg:#E3E3E3; --st-not-ink:#333333; --st-prog-bg:#FCF6E4; --st-prog-ink:#6B5418;
    --st-done-bg:#DCEFE2; --st-done-ink:#256B41; --st-rev-bg:#E1E8F0; --st-rev-ink:#0A345A;
    --shadow:rgba(10,52,90,.14); --backdrop:rgba(5,20,36,.45); --skeleton:#DDD7C8;

    color-scheme:dark; }

  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; }
  body { background:var(--page); color:var(--ink); font-family:var(--sans); font-size:var(--fs-body); line-height:1.45; -webkit-font-smoothing:antialiased; }
  button, select, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  a { color:var(--link); }
  .wrap { max-width:1160px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }

  header .wrap { max-width:none; }
  @media (min-width:700px) { header .wrap { padding-left:max(28px, env(safe-area-inset-left, 0px)); padding-right:max(28px, env(safe-area-inset-right, 0px)); } }
  /* Critique 3 #1 (Nov 16): no navy logo bar. Computers get a slim bar in the page color (tree and Huddle, the tabs, your
     initials); phones have no bar at all: each page starts with its large title, and a thin bar with a small centered title
     appears once you scroll past it (#tbar), like Reminders and Mail. */
  header { background:var(--page); color:var(--ink); position:sticky; top:0; z-index:20; padding-top:env(safe-area-inset-top, 0px); border-bottom:1px solid var(--line-soft); }
  header .logo { display:none; }
  .brand { display:flex; align-items:center; gap:8px; flex:none; color:var(--heading); }
  .brand b { font-family:var(--serif); font-weight:600; font-size:var(--fs-title); }
  svg.tree { width:auto; height:26px; display:block; flex:none; }
  header nav.top { flex:1; justify-content:center; align-self:stretch; align-items:flex-end; }
  .bar { display:flex; align-items:center; gap:16px; padding-block:6px 0; min-height:52px; }
  .logo { height:42px; width:auto; flex:none; display:block; }
  .divider { width:1px; height:30px; background:rgba(255,255,255,.28); flex:none; }
  /* The logo's ENDODONTIC line sits 4.8% of the logo height below its middle; this lines the title up with it. */
  .bar h1 { margin:0; font-family:var(--serif); font-weight:600; font-size:var(--fs-title); line-height:1; white-space:nowrap; transform:translateY(calc(42px * .048)); }
  /* LB-17: on phones the logo bar shows only at the top of My Tasks and scrolls away; elsewhere the page title is enough. */
  @media (max-width:699px) { header { display:none; }
    /* Nov 10: the space under the clock sits above the pull-to-refresh strip, not inside the page, so "Release to refresh"
       grows into view below the clock (it used to grow under the clock, where it couldn't be seen). */
    #ptr { margin-top:env(safe-area-inset-top, 0px); }
    #livebar:not([hidden]) ~ #ptr { margin-top:0; }
    /* The no-signal bar too: when it's the first thing on the page, it starts below the clock. */
    #offline:not([hidden]) { padding-top:var(--top-safe); }
    #livebar:not([hidden]) ~ #offline:not([hidden]) { padding-top:8px; }
    #offline:not([hidden]) ~ #ptr { margin-top:0; }
    body.v-live main { padding-top:30px; }
    /* Nov 10: the live meeting bar shows on every tab. Without the logo bar it used to sit under the clock, out of sight;
       now it starts below the clock and stays pinned to the top while you scroll, so anyone can join from anywhere. */
    #livebar { position:sticky; top:0; z-index:22; padding-top:calc(var(--top-safe) + 4px); }
    /* Nov 12: with the header on every tab, the live bar sits under it and sticks just below the clock while you scroll. */
 }
  @media (max-width:420px) { .logo { height:30px; } .divider { height:24px; } .bar { gap:8px; } }

  .avatar { display:block; flex:none; overflow:visible; }
  .avatar circle { fill:var(--avatar); stroke:var(--card); }
  .avatar text { fill:var(--avatar-ink); font-family:var(--sans); font-weight:600; }
  .avatars { display:inline-flex; align-items:center; }
  .avatars .avatar + .avatar { margin-left:-8px; }

  nav.top { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
  nav.top::-webkit-scrollbar { display:none; }
  nav.top button { background:none; border:none; color:var(--muted); padding:8px 12px 12px; font-size:var(--fs-sub); font-weight:600; border-bottom:3px solid transparent; white-space:nowrap; }
  nav.top button.on { color:var(--heading); border-bottom-color:var(--gold); }
  .count { display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 4px; margin-left:4px; border-radius:8px; background:var(--gold); color:#142640; font-size:var(--fs-cap); font-weight:600; line-height:1.15; }

  /* The app runs inside Google's frame, where the phone's safe-area inset often reads 0, so keep at least 30px under the bar
     to clear the rounded corners and the home indicator. */
  :root { --nav-under:max(30px, env(safe-area-inset-bottom, 0px)); }
  /* Nov 16 (Brayden): iOS fades the strip under the clock (its Liquid Glass edge). Nothing in the app may sit in it: every
     fixed or top-placed thing starts at or below --top-safe (24pt under the clock). topSafe() gives the same line in px. */
  :root { --top-safe:calc(env(safe-area-inset-top, 0px) + 24px); }
  nav.bottom { display:none; position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--card); border-top:1px solid var(--line);
    padding:10px max(14px, env(safe-area-inset-right, 0px)) var(--nav-under) max(14px, env(safe-area-inset-left, 0px)); }
  nav.bottom .tabs { --ntabs:4; display:grid; grid-template-columns:repeat(var(--ntabs), 1fr); max-width:520px; margin:0 auto; }
  nav.bottom button { background:none; border:none; display:grid; justify-items:center; gap:4px; padding:8px 0 8px; color:var(--muted); font-size:var(--fs-cap); font-weight:600; position:relative; }
  nav.bottom button svg { width:24px; height:24px; }
  nav.bottom button span { font-size:min(var(--fs-cap), 13px); white-space:nowrap; }   /* layout #8: like iOS, tab labels don't grow */
  h2, .head-row h2 { overflow-wrap:normal; word-break:normal; hyphens:none; }
  .ts-big .head-row.ptitle { flex-wrap:wrap; } .ts-big .head-row.ptitle .ptools { margin-left:auto; }
  .mtab button { white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  nav.bottom button.on { color:var(--heading); }
  nav.bottom button::before { content:""; position:absolute; inset:0 8px; border-radius:12px; background:var(--heading); opacity:0; transition:opacity .2s; z-index:-1; }
  nav.bottom button.on::before { opacity:.08; }
  nav.bottom button { isolation:isolate; }
  nav.bottom .count { position:absolute; top:3px; left:calc(50% + 6px); margin:0; }
  @media (max-width:699px) { nav.top { display:none; } nav.bottom { display:block; } }

  .preview { background:var(--gold-soft); color:var(--gold-ink); font-size:var(--fs-sub); text-align:center; padding:8px 16px; }
  main { padding-block:16px 140px; }
  h2 { font-family:var(--serif); font-weight:600; font-size:var(--fs-large); color:var(--heading); margin:4px 0 12px; text-wrap:balance; }
  h3 { font-family:var(--serif); font-weight:600; font-size:var(--fs-title); line-height:1.15; color:var(--heading); margin:0 0 8px; }
  .muted { color:var(--muted); }
  .small { font-size:var(--fs-sub); }
  .head-sub { margin:-8px 0 12px; }
  .lead { margin:-8px 0 16px; color:var(--muted); font-size:var(--fs-body); }

  .stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 8px; text-align:left; display:grid; gap:4px; }
  .stat.on { border-color:var(--heading); box-shadow:inset 0 0 0 1px var(--heading); }
  .stat b { font-family:var(--serif); font-weight:600; font-size:var(--fs-large); line-height:1.15; color:var(--heading); font-variant-numeric:tabular-nums; }
  .stat span { font-size:var(--fs-cap); color:var(--muted); line-height:1.15; }
  .stat.alert b { color:var(--red); }

  .people { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px; scrollbar-width:none; }
  .people::-webkit-scrollbar { display:none; }
  .person { flex:none; display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 12px 4px 4px; font-size:var(--fs-sub); font-weight:600; }
  .person.on { background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }
  .person.on .avatar circle { fill:var(--card); stroke:var(--primary); }
  .person.on .avatar text { fill:var(--heading); }
  .person .n { color:var(--muted); font-size:var(--fs-sub); font-variant-numeric:tabular-nums; }
  .person.on .n { color:inherit; opacity:.8; }
  .person .late { color:var(--red); font-weight:600; font-size:var(--fs-cap); }

  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .search { flex:1 1 120px; min-width:0; position:relative; }
  .ts-big .search { flex-basis:100%; }
  .search svg { position:absolute; left:12px; top:50%; width:16px; height:16px; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .search input { width:100%; border:1px solid var(--line); background:var(--field); border-radius:999px; padding:8px 12px 8px 32px; font-size:var(--fs-body); }
  .chipbtn { flex:none; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:8px 12px; font-size:var(--fs-sub); font-weight:600; display:inline-flex; align-items:center; gap:8px; }
  .chipbtn.on { border-color:var(--heading); color:var(--heading); }
  .chipbtn .count { margin-left:0; }
  .seg { display:inline-flex; background:var(--line-soft); border-radius:12px; padding:4px; flex:none; }
  .seg button { border:none; background:none; padding:8px 12px; border-radius:8px; font-size:var(--fs-sub); color:var(--muted); font-weight:600; }
  .seg button.on { background:var(--seg-on, var(--card)); color:var(--seg-on-ink, var(--heading)); box-shadow:0 1px 2px var(--shadow); }
  .alf-link { display:inline; }
  .linkbtn, .report-link, .sum-links a, .meeting .links a, .alf-msg a, .alf-link, .src a { border:none; background:none; padding:0; color:var(--link); font-weight:600; font-size:inherit;
    text-decoration:underline; text-decoration-color:var(--gold); text-decoration-thickness:1px; text-underline-offset:3px; text-align:left; }
  .linkbtn { font-size:var(--fs-sub); padding:4px 0; }

  .group { display:flex; align-items:center; gap:8px; margin:16px 4px 8px; font-size:var(--fs-cap); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .group:first-child { margin-top:4px; }
  .group.late { color:var(--red); }
  .group.done-week { color:var(--st-done-ink); }
  .group .n { font-variant-numeric:tabular-nums; font-weight:600; }
  .group .capsule { margin:0 2px 0 auto; text-transform:none; letter-spacing:0; }
  /* Nov 16 (Brayden, spacing option C, 16 above): every section heading is a 30pt row with its words (and the navy
     button, on the first one) on the bottom line, 10pt above its card and 20pt below the card before; the button has 16pt
     above it. The same on My Tasks, Team Tasks, Meetings, Decisions and Parking Lot. */
  #results .group { align-items:flex-end; min-height:30px; margin:20px 4px 10px; line-height:1.2; }
  #results > .group:first-child { margin-top:var(--cap-top, 16px); }
  .mg-head { align-items:flex-end !important; min-height:30px; margin:20px 0 10px !important; }
  .mg-head .set-sec { margin:0 4px !important; line-height:1.2; }
  #decResults > .mg-head:first-child, #tpResults > .mg-head:first-child, #mResults > .mg-head:first-child { margin-top:var(--cap-top-m, 16px) !important; }
  .mg-head.mg-only { margin:var(--cap-top-m, 16px) 0 10px !important; }
  .capsule { margin-bottom:0 !important; line-height:1.2; }   /* Nov 17: the same height on every tab */
  .list { display:grid; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .title .lock, .src.priv .lock { width:.95em; height:.95em; vertical-align:-.1em; margin-right:8px; color:var(--muted); }
  .src.priv { color:var(--muted); }

  /* The + and Alfred's hat are Liquid Glass that blurs what scrolls under them (Nov 16, Brayden's pick from four).

  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) { @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fab, :root:not([data-theme="light"]) .alf-fab { background:var(--primary); } } }

  /* ---------- Mobile polish (Nov 10) ---------- */
  /* No gray tap rectangle anywhere (it was the flash behind the tab bar buttons). */
  html { -webkit-tap-highlight-color:transparent; }
  /* Long text wraps instead of being cut off. */
  .meta .mb { white-space:normal; overflow:visible; }
  .livebar span:nth-child(2), .alf-head small, .alf-tools .note, .req-line .t { white-space:normal; overflow:visible; text-overflow:clip; }
  h1, h2, h3, .t, .title, .name, .step-title, .sec, b, .banner span { overflow-wrap:break-word; }
  /* The tab bar's highlight is one pill that slides to the tab you tap. */
  nav.bottom .tabs { position:relative; }
  nav.bottom button::before { display:none; }
  nav.bottom .ind { position:absolute; top:0; bottom:0; left:0; width:calc(100% / var(--ntabs, 3)); padding:0 8px; box-sizing:border-box; pointer-events:none;
    transition:transform .36s cubic-bezier(.32,.72,0,1), opacity .2s; }
  nav.bottom .ind::before { content:""; display:block; height:100%; border-radius:12px; background:var(--heading); opacity:.08; }
  nav.bottom button { transition:color .25s; }
  nav.bottom button svg { transition:transform .3s cubic-bezier(.32,.72,0,1); }
  nav.bottom button.on svg { transform:scale(1.08); }
  nav.bottom button:active svg { transform:scale(.9); }
  /* Motion: screens cross-fade and rise slightly; in-place changes cross-fade; the tab bar and floating buttons stay put. */
  ::view-transition { pointer-events:none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration:.2s; }
  @keyframes vtIn { from { opacity:0; transform:translateY(10px); } }
  @keyframes vtOut { to { opacity:0; } }
  html.vt-page::view-transition-new(root) { animation:vtIn .3s cubic-bezier(.2,.8,.2,1) both; }
  html.vt-page::view-transition-old(root) { animation:vtOut .18s ease both; }
  /* AP-2: on Huddle's own web address the tab bar is iPhone-sized (the 30px minimum was for Google's frame). */
  html.web { --nav-under:max(8px, env(safe-area-inset-bottom, 0px)); }
  html.web nav.bottom { padding-top:4px; }
  html.web nav.bottom button { padding:6px 0 4px; }
  nav.bottom { view-transition-name:tabbar; } .fab { view-transition-name:fab; } .alf-fab { view-transition-name:alfred; }
  /* Nov 10 (Batch 2): one set of motion tokens, and every screen change slides in 0.25s (Brayden's choice).
     Push (into a screen from More, Settings or a banner): the new page slides in from the right over the old one, which
     moves a third of the way left and dims. Pop (‹ Back): the reverse. Switching tabs is instant (only the tab bar's pill
     slides). The tab bar, + and Alfred stay put. */
  :root { --ease-ios:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.4,0,1,1); --d-nav:.25s; }
  @keyframes navInRight { from { transform:translateX(100%); } }
  @keyframes navOutRight { to { transform:translateX(100%); } }
  @keyframes navUnder { to { transform:translateX(-30%); filter:brightness(.9); } }
  @keyframes navFromUnder { from { transform:translateX(-30%); filter:brightness(.9); } }
  html.vt-push::view-transition-old(root), html.vt-push::view-transition-new(root), html.vt-pop::view-transition-old(root), html.vt-pop::view-transition-new(root) { mix-blend-mode:normal; }
  html.vt-push::view-transition-old(root) { animation:navUnder var(--d-nav) var(--ease-ios) both; }
  html.vt-push::view-transition-new(root) { animation:navInRight var(--d-nav) var(--ease-ios) both; }
  html.vt-pop::view-transition-old(root) { animation:navOutRight var(--d-nav) var(--ease-ios) both; z-index:1; }
  html.vt-pop::view-transition-new(root) { animation:navFromUnder var(--d-nav) var(--ease-ios) both; }
  /* During a screen change the switch pills move with their page (not as separate pieces). */
  html.vt-push .seg, html.vt-pop .seg { view-transition-name:none !important; }
  /* More is a page (Batch 2, LB-2): one grouped list like the iPhone's Settings. */
  .more-menu { gap:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
  .more-menu button { border:none; border-radius:0; border-top:1px solid var(--line-soft); }
  .more-menu button:first-child { border-top:none; }
  .more-menu .chev { margin-left:auto; color:var(--muted); font-size:20px; line-height:1; }
  /* Computer top tabs: one gold underline that slides to the tab you pick. */
  nav.top { position:relative; }
  nav.top .top-ind { position:absolute; left:0; bottom:0; height:3px; border-radius:2px; background:var(--gold); pointer-events:none; transition:transform var(--d-nav) var(--ease-ios), width var(--d-nav) var(--ease-ios); }
  nav.top.has-ind button.on { border-bottom-color:transparent; }
  /* AP-5: a task row turns light gray while pressed, like an iPhone list. */
  article.task { transition:background-color .15s; }
  article.task:active:not(.swiping) { background-color:var(--line-soft); }
  /* AC-1: chips, tabs, back links and banners keep their look but get a 44pt tap area. */
  .chips button, .quick-dates button, .mtab button, .back, .chipbtn, .rv-banner { position:relative; }
  .chips button::after, .quick-dates button::after, .chipbtn::after, .rv-banner::after { content:""; position:absolute; inset:-4px 0; }
  .mtab button::after { content:""; position:absolute; inset:-5px 0; }   /* layout #19 */
  .alf-sugg button, .alf-pickbtn { position:relative; } .alf-sugg button::after { content:""; position:absolute; inset:-4px 0; }
  .alf-pickbtn { width:44px; height:44px; }   /* layout #20 */
  .back::after { content:""; position:absolute; inset:-8px -6px; }
  @media (max-width:699px) { .head-tools .tool-ico { width:44px; height:44px; } }
  /* AC-3: page titles use the title line height. */
  h2 { line-height:1.15; }
  /* The edge swipe back moves the page with the finger. */
  main.edge-drag { will-change:transform; }
  ::view-transition-old(tabbar), ::view-transition-old(fab), ::view-transition-old(alfred) { display:none; }
  ::view-transition-new(tabbar), ::view-transition-new(fab), ::view-transition-new(alfred) { animation:none; }
  ::view-transition-group(tabbar), ::view-transition-group(fab), ::view-transition-group(alfred) { animation:none; }
  /* Buttons that flip between on and off ease their colors. */
  .seg button, .chips button, .chipbtn, .person, .quick-dates button, .mm-seg button, .topic-pick > button, .rate > button, .btn, .set-row, .banner, .card {
    transition:background-color .2s, color .2s, border-color .2s, box-shadow .2s, transform .15s; }
  .seg button:active, .chips button:active, .chipbtn:active, .person:active, .quick-dates button:active, .btn:active, .banner:active, button.card:active { transform:scale(.97); }
  /* The toast slides up as it fades in. */
  /* The toast can use the full width (minus 16px each side), so short messages stay on one line, and it has roomy padding
     with rounded (not pill) corners, so wrapped text never crowds the edges. */
  .toast { left:0; right:0; margin:0 auto; width:max-content; max-width:calc(100% - 32px); box-sizing:border-box;
    padding:12px 16px; border-radius:12px; gap:16px; line-height:1.35;

  .toast.show { transform:none; transition:opacity .2s ease, transform .5s cubic-bezier(.34,1.45,.64,1); }
  @media (prefers-reduced-motion: reduce) { .toast, .toast.show { transform:none; transition:opacity .2s; } }
  /* Nov 16 (#47): with a panel open, messages appear at the top of the screen instead of over the panel's buttons. */
  /* Critique 4 layout #6: panel buttons live in the header, so a message over a panel sits at the bottom, not over the title. */
  body.sheet-on .toast { top:auto; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); }
  @media (max-width:699px) { body.has-fab:not(.sheet-on):not(.live-on) .toast { bottom:calc(88px + 54px + 14px + var(--nav-under)); } }   /* layout #11 */
  /* Opened sections (details, expanded requests) ease in. */
  @keyframes openIn { from { opacity:0; transform:translateY(-4px); } }
  details[open] > :not(summary), .req.open > :not(.req-line) { animation:openIn .25s cubic-bezier(.2,.8,.2,1); }
  details summary::after { transition:transform .2s; }

  .fab { transition:transform .2s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  .fab:active { transform:scale(.92); }
  /* Phones: a tighter top on My Tasks: a slim review line, and the greeting shares a row with search and Filter. */
  @media (max-width:699px) {
    /* Nov 16 (Brayden): iOS fades the strip just under the clock (its Liquid Glass edge), so the title row starts a little
       lower to stay clear of it. Pages and the meeting screen alike; the thin scroll bar's content sits lower too. */
    body:not(.v-live) main { padding-top:24px; }
    .rv-banner { padding:8px 12px; margin-bottom:12px; font-size:var(--fs-sub); gap:8px; }
    .rv-banner .go { font-size:var(--fs-body); }
    .head-row.compact { align-items:center; margin-bottom:12px; }

  .meta .mb.nl .dot { display:none; }
  body.fabs-away .fab, body.fabs-away .alf-fab { opacity:0; transform:scale(.6); pointer-events:none; }

  /* ---------- Round 2 (Nov 10): layout A rows, sliding switches, sheets that slide, meeting editing, welcome tour ---------- */
  :root { --p-high:#D64545; --p-med:#F4B740; --p-low:#3E9B5B; }
  [data-theme=dark] { --p-high:#F07A7A; --p-med:#F6C254; --p-low:#5CC27E; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --p-high:#F07A7A; --p-med:#F6C254; --p-low:#5CC27E; } }
  .pdot { display:inline-block; width:10px; height:10px; border-radius:50%; flex:none; vertical-align:middle; }
  .pdot.p-high { background:var(--p-high); } .pdot.p-med { background:var(--p-med); } .pdot.p-low { background:var(--p-low); }
  /* Red means High priority only: overdue is shown with bold text, not red. */

  .chipbtn.late { border-color:var(--heading); }
  .chipbtn.late.on { background:var(--line-soft); box-shadow:inset 0 0 0 1px var(--heading); }
  /* Layout A: one row per task. */

  .row-a .body { gap:4px; }
  .row-a .side { display:flex; align-items:center; gap:8px; margin-left:8px; align-self:center; }
  .row-a .avatars .avatar + .avatar { margin-left:-6px; }
  .rdate { display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-sub); color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }

  /* The status box: empty = Not Started, half = In Progress, checked = Done. Gray, never colored. */
  .circ.box i, .tbox { width:calc(22px * var(--ts)); height:calc(22px * var(--ts)); border-radius:8px; border:2px solid currentColor; display:grid; place-items:center; transition:background .2s, transform .2s cubic-bezier(.2,.8,.2,1); }
  .circ.box, .circ.box.prog, .circ.box.on, .task.checking .circ.box { color:var(--muted); }
  .circ.box.prog i, .tbox.prog { background:linear-gradient(90deg, currentColor 50%, transparent 50%); }

  .circ.box:active i { transform:scale(.88); }
  /* Blocked: the same gray box with a short dash inside. Status stays gray; priority is the only color. */
  .circ.box i > svg, .tbox > svg { grid-area:1/1; }
  .circ.box.blk i::before, .tbox.blk::before { content:''; grid-area:1/1; width:50%; height:2px; border-radius:1px; background:currentColor; }
  .tbox { color:var(--muted); width:22px; height:22px; flex:none; }
  .tbox svg { width:70%; height:70%; color:var(--card); }
  /* Segmented switches: one pill that slides. */
  .seg { position:relative; }
  .seg > button { position:relative; z-index:1; transition:color .25s; }

  .owners-box { display:flow-root; }
  .seg-ind { position:absolute; left:0; top:0; border-radius:8px; background:var(--seg-on, var(--card)); box-shadow:0 1px 3px var(--shadow), inset 0 0 0 1px var(--seg-on-ring, transparent); pointer-events:none; z-index:0;
    transition:transform .34s cubic-bezier(.32,.72,0,1), width .34s cubic-bezier(.32,.72,0,1), opacity .2s; }
  ::view-transition-old(*.segvt) { display:none; }
  ::view-transition-new(*.segvt), ::view-transition-group(*.segvt) { animation:none; }
  /* Panels slide up from the bottom and back down (keyframes start off-screen on the first frame, so nothing flashes). */
  @keyframes sheetIn { from { transform:translateY(105%); } to { transform:none; } }
  @keyframes sheetOut { from { transform:none; } to { transform:translateY(105%); } }
  @keyframes bdIn { from { opacity:0; } }
  @keyframes bdOut { to { opacity:0; } }
  @keyframes popIn { from { opacity:0; transform:translateY(16px) scale(.98); } }
  @keyframes popOut { to { opacity:0; transform:translateY(16px) scale(.98); } }

  .sheet-wrap.opening .sheet { animation:sheetIn .42s cubic-bezier(.32,.72,0,1) both; }

  .sheet-wrap.leave .backdrop { animation:bdOut .28s ease both; }
  @media (min-width:700px) { .sheet-wrap.opening .sheet { animation:popIn .3s cubic-bezier(.2,.8,.2,1) both; } .sheet-wrap.leave .sheet { animation:popOut .22s ease both; } }
  .sheet-wrap.dialog.opening .sheet { animation:dlgIn .26s cubic-bezier(.2,.8,.2,1) both; }

  /* Team Tasks: the print button sits to the right of the title. */

  .head-row.team-head .print-btn { margin:1px 0 0; }
  .print-btn::after { content:""; position:absolute; inset:-4px; }   /* 44pt to tap, 36pt to look at */
  /* Nov 16 (Brayden): a plain icon like search and sort beside it, no white circle behind it. */
  .print-btn { position:relative; margin-left:0; width:40px; height:40px; border-radius:50%; border:none; background:none; color:var(--heading); display:grid; place-items:center; flex:none; padding:0; }
  .print-btn svg { width:22px; height:22px; }
  .print-btn:active { transform:scale(.94); }
  /* Nov 17 (Brayden): "Updated 2 min ago" at the bottom of the page, centered, on every tab that refreshes on its own. */
  .synced.foot-sync { display:block; text-align:center; margin:24px 0 0; line-height:1.3; }

  /* Search: an x inside the field instead of a Cancel button. */
  .search .search-x { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:36px; height:36px; border:none; background:none; color:var(--muted); display:grid; place-items:center; padding:0; }
  .search .search-x svg { position:static; transform:none; width:18px; height:18px; color:inherit; }
  .search-row .search input { padding-right:40px; }

  /* Hidden switch used only for the iPhone's tap feel. */

  /* Welcome tour. */

  /* ---------- Guided tour: a spotlight on the real app with a bubble beside it ---------- */
  .coach { position:fixed; inset:0; z-index:60; }

  .coach-tap.go { animation:coachtap .6s ease-out; }
  @keyframes coachtap { 0% { transform:scale(.4); opacity:.9; } 100% { transform:scale(1.6); opacity:0; } }
  .coach-press { transform:scale(.92); transition:transform .12s; }

    transition:left .38s cubic-bezier(.32,.72,0,1), top .38s cubic-bezier(.32,.72,0,1), width .38s cubic-bezier(.32,.72,0,1), height .38s cubic-bezier(.32,.72,0,1), border-radius .38s; }

    transition:top .38s cubic-bezier(.32,.72,0,1), left .38s cubic-bezier(.32,.72,0,1); animation:coachIn .3s cubic-bezier(.2,.8,.2,1); }

  .coach-dots { display:flex; gap:6px; margin-bottom:8px; } .coach-dots i { width:7px; height:7px; border-radius:50%; background:var(--line); } .coach-dots i.on { background:var(--gold); }
  .coach-step { font-size:var(--fs-cap); color:var(--muted); font-weight:600; letter-spacing:.06em; }

  /* Team Tasks: everyone in one row of initials with count bubbles (white; coral when overdue). */
  :root { --coral:#F26B5B; --coral-ink:#FFFFFF; --bubble:#FFFFFF; --bubble-ink:#0A345A; --bubble-line:#D3D3D3; }
  [data-theme=dark] { --coral:#F48477; --coral-ink:#2A0B07; --bubble:#E9EDF1; --bubble-ink:#0A345A; --bubble-line:#E9EDF1; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --coral:#F48477; --coral-ink:#2A0B07; --bubble:#E9EDF1; --bubble-ink:#0A345A; --bubble-line:#E9EDF1; } }
  .people.faces { display:grid; grid-template-columns:repeat(auto-fit, minmax(52px, 1fr)); gap:4px; overflow:visible; padding:6px 0 0; }

  .fbadge { position:absolute; top:-6px; right:-9px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; box-sizing:border-box;
    background:var(--bubble); color:var(--bubble-ink); border:1px solid var(--bubble-line); font-size:var(--fs-cap); font-weight:600; line-height:1;

  .face-name { font-size:var(--fs-cap); color:var(--muted); line-height:1.15; text-align:center; }

  /* Panels: the page behind never rubber-bands, and a drag that starts on the panel's header or handle is the panel's. */

  .due.late, .meta .due.late { color:var(--muted); font-weight:400; font-style:italic; }

  /* Task rows, layout 1A: a 40-point priority bar centered at the far left, initials stacked on the right. */
  article.task.row-a { align-items:center; min-height:56px; padding-left:14px; }
  .row-a .pbar { position:absolute; left:6px; top:50%; width:5px; height:40px; margin-top:-20px; border-radius:999px; background:transparent; }
  .row-a.pr-high .pbar { background:var(--p-high); } .row-a.pr-medium .pbar { background:var(--p-med); } .row-a.pr-low .pbar { background:var(--p-low); }

  .rows-stack article.task { align-items:center; }

  .card.rv { position:relative; overflow:hidden; } .card.rv .pbar { position:absolute; left:0; top:0; bottom:0; width:4px; }
  .row-a .side { align-self:center; margin:0 0 0 8px; display:flex; }

  .ostack .avatar:nth-child(1) { z-index:3; } .ostack .avatar:nth-child(2) { z-index:2; } .ostack .avatar:nth-child(3) { z-index:1; }

  article.task.row-a + article.task.row-a::after { left:calc((11px + 3 * (14px + (44px - 22px * var(--ts)) / 2)) / 4); right:16px; }

  /* Team Tasks › One-on-Ones */
  .seg.ttab { margin:0 0 12px; }

  .ones-body { flex:1; min-width:0; display:grid; gap:4px; }

  .tag.big { font-size:var(--fs-sub); padding:4px 10px; flex:none; }

  .tag.blk { background:var(--st-not-bg); color:var(--st-not-ink); }
  /* The task panel's four statuses fit one row on a 375-wide phone (they wrap at the largest text sizes). */
  .seg.st4 { display:flex; width:100%; }

  /* Toast: the same blue as the + button, with white text and a white Undo. */
  .toast { background:var(--primary); color:var(--primary-ink); }
  /* Nov 10: a white border so the toast stands apart from the same-colored + and Alfred buttons. */
  .toast { border:2px solid var(--primary-ink); box-shadow:0 6px 20px rgba(0,0,0,.18); }
  /* The Accountability Report opens inside the app (Nov 10): the page color and a spinner while it loads, no white tab. */
  .report-screen { position:fixed; inset:0; z-index:60; background:var(--page); overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .report-screen .rp-load { position:fixed; inset:0; display:grid; place-items:center; }
  .report-screen .rp-load .spin { width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--heading); border-radius:50%; animation:spin .8s linear infinite; }
  .report-screen .rp-bar { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:12px; padding:var(--top-safe) 16px 10px; background:var(--page); border-bottom:1px solid var(--line); }
  .report-screen .rp-bar b { flex:1; min-width:0; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:var(--serif, "STIX Two Text", Georgia, serif); font-size:var(--fs-body); color:var(--heading); }
  .report-screen .rp-paper { background:#fff; color:#333; border-radius:12px; margin:16px auto calc(24px + env(safe-area-inset-bottom, 0px)); padding:16px; max-width:820px; width:calc(100% - 32px); box-sizing:border-box; overflow-x:auto; }
  .report-screen .rp-paper h2 { margin-top:0; }
  @media screen { .report-screen .rp-paper > div > h2:first-child { display:none; } }   /* LB-4: the bar already says it; it still prints */
  .report-screen .rp-err { text-align:center; padding:64px 16px; color:var(--muted); }

    body.printing-report > *:not(#report) { display:none !important; }

    .report-screen .rp-bar { display:none; }

  }
  /* Nov 23 (#20): the printable backup agenda */
  .ba h2 { font-family:var(--serif, Georgia, serif); color:#0A345A; margin:0 0 2px; font-size:22px; }
  .ba h3 { font-family:var(--serif, Georgia, serif); color:#0A345A; border-bottom:1.5px solid #C6A85C; padding-bottom:3px; margin:18px 0 6px; font-size:16px; break-after:avoid; }
  .ba h4 { margin:10px 0 2px; font-size:14px; } .ba ul { margin:2px 0 6px; padding-left:20px; } .ba li { margin:2px 0; font-size:13px; }
  .ba-sub, .ba-none { color:#666; font-size:12px; margin:2px 0; }
  .ba-t { width:100%; border-collapse:collapse; font-size:13px; } .ba-t th, .ba-t td { border:1px solid #bbb; padding:5px 7px; text-align:left; vertical-align:top; }
  .ba-t th { background:#F3EEE2; } .ba-t tr { break-inside:avoid; } .ba-areas td:first-child { width:34%; } .ba-rate { white-space:nowrap; color:#888; width:1%; }
  .ba-write td { height:26px; } .ag-dup { color:var(--gold-ink, #7a5c12); } .ask-warn { color:var(--red, #b3261e); }
  .toast button { color:var(--primary-ink); text-decoration:underline; text-underline-offset:3px; }

  /* ---------- Huddle's own web address (html.web) ---------- */
  /* The page reaches under the iPhone clock there (black-translucent status bar). Nov 10: no navy strip; the area under the
     clock is the page's own color, and webTint() sets theme-color to it, so the phone's top fade matches the page.
     On a home-screen app, 100vh leaves out the clock area; a page shorter than the screen then lifted the tab bar and left
     a beige gap under it. The page is always at least the full screen tall. */
  html.web body { min-height:calc(100vh + env(safe-area-inset-top, 0px)); }
  /* Nov 10: a solid strip under the clock, the color of what's at the top (navy header on My Tasks, the page elsewhere), so
     content scrolls cleanly under it and the iPhone's blur under the clock has nothing to smudge (like Google Docs). */
  html.web body::before { content:""; position:fixed; left:0; right:0; top:0; height:env(safe-area-inset-top, 0px); background:var(--page); z-index:30; pointer-events:none; }
  html.web body.tv::before, html.web body.signing-in::before { display:none; }
  /* The sign-in screen (webSignIn): navy, Huddle's name, Google's button. */
  .signin { position:fixed; inset:0; z-index:80; background:var(--header); color:var(--header-ink); display:grid; place-items:center; overflow-y:auto;
    padding:calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
  .si-box { width:100%; max-width:340px; text-align:center; display:grid; justify-items:center; gap:8px; }
  .si-icon { width:88px; height:88px; border-radius:20px; box-shadow:0 0 0 2px rgba(198,168,92,.7), 0 6px 18px rgba(0,0,0,.3); }
  .si-box h1 { font-family:var(--serif); font-weight:600; font-size:var(--fs-large); line-height:1.15; margin:16px 0 0; }
  .si-sub { margin:0 0 24px; color:var(--header-muted); font-size:var(--fs-sub); line-height:1.45; }
  .si-btn { min-height:44px; display:grid; place-items:center; }
  .si-btn.busy { opacity:.5; pointer-events:none; }
  .si-wait { color:var(--header-muted); font-size:var(--fs-sub); }
  .si-retry { border:none; border-radius:999px; background:#FFFFFF; color:#0A345A; font-weight:600; padding:12px 24px; }
  .si-note { margin:16px 0 0; color:var(--header-muted); font-size:var(--fs-sub); line-height:1.45; }
  .si-err { margin:8px 0 0; min-height:1.45em; color:var(--gold); font-size:var(--fs-sub); font-weight:600; line-height:1.45; }
  .si-err:empty { display:none; }
  body.signing-in .alf-fab, body.signing-in .fab { display:none !important; }
  /* ---------- Batch 3 (Nov 11): motion ---------- */
  /* One set of motion tokens (the Batch 2 ones plus a gentle spring). linear() is used where the browser has it; older
     iPhones get the cubic fallback. The script uses the same values (EASE in the main script). */
  :root { --spring:cubic-bezier(.34,1.3,.64,1); --d-fast:.18s; }
  @supports (transition-timing-function:linear(0, 1)) {
    :root { --spring:linear(0, .18 6%, .55 15%, .86 26%, 1.02 38%, 1.04 46%, 1.01 60%, 1); } }
  /* Timers ease into gold (last minute) and red (over) instead of snapping (MO-8). */
  .timer, .bigtimer, .step-line span, .tv-timer, .tv-small span { transition:color .4s ease, background-color .4s ease, border-color .4s ease; }
  /* The live meeting bar collapses in and out (MO-11); while it moves its content stays put. */
  .livebar.moving { overflow:hidden; }
  /* TV mode on and off cross-fade (MO-13). */
  html.vt-fade::view-transition-old(root), html.vt-fade::view-transition-new(root) { animation-duration:.25s; animation-timing-function:ease; }
  /* A toast follows the finger when it's swiped down (MO-B12). */
  .toast.dragging { transition:none !important; }
  /* Numbers that change get a small pop (MO-12): they need a box to scale. */
  [data-num] { display:inline-grid; }
  nav.bottom .count[data-num], .fbadge[data-num] { display:inline-grid; place-items:center; }
  /* "This Isn't Your Task" over an open panel (MO-B9): its own small dialog above the panel. */
  .ask-over { position:fixed; inset:0; z-index:47; display:grid; place-items:center; padding:24px; }
  .ask-over .backdrop { background:var(--backdrop); }
  .ask-over .ask-box { position:relative; width:100%; max-width:380px; background:var(--card); border-radius:18px; padding:24px; box-shadow:0 12px 40px var(--shadow); }
  .ask-over .ask-box h3 { margin:0 0 8px; }
  .ask-over .ask-box p { margin:0 0 16px; line-height:1.45; }
  /* Kinder Reduce Motion (MO-14): nothing slides, scales or springs, but changes still fade in 150-200ms, and the
     switch and tab pills still move (straight, no overshoot). The script swaps its own movement for fades (motion()). */
  @media (prefers-reduced-motion: reduce) {
    .seg-ind, nav.bottom .ind { transition:transform .2s ease, width .2s ease, opacity .2s ease !important; }
    nav.top .top-ind { transition:transform .2s ease, width .2s ease !important; }
    .sheet-wrap.opening .sheet, .sheet-wrap.dialog.opening .sheet { animation:fade .18s ease both !important; }
    .sheet-wrap.leave .sheet, .sheet-wrap.dialog.leave .sheet, .sheet-wrap.leave.dragged .sheet { animation:bdOut .18s ease both !important; transition:none !important; }
    .sheet-wrap.opening .backdrop { animation:fade .18s ease both !important; }
    .sheet-wrap.leave .backdrop { animation:bdOut .18s ease both !important; }
    .timer, .bigtimer, .step-line span { transition:color .2s ease, background-color .2s ease, border-color .2s ease !important; }
  }
</style>

// The tab button for a view (the bottom bar on a phone, the top bar on a computer).
function coachTab(view){ if (view==='team' && S.view==='mine') return document.querySelector('#main .tside [data-val="team"]');   // Personal → Team is the switch
  return [...document.querySelectorAll('#navBottom [data-view="'+tabKey(view)+'"], #navTop [data-view="'+tabKey(view)+'"]')].find(e=>{ const r=e.getBoundingClientRect(); return r.width>0 && r.height>0; }); }
// The dimming fades away, a ring and a tap show on the tab's button, the tab opens, then the dimming comes back.
function coachTravel(view){
  return new Promise(done=>{
    const ov=document.getElementById('coach'), spot=ov.querySelector('.coach-spot'), bub=ov.querySelector('.coach-bub'), tab=coachTab(view);
    S.coachBusy=true; ov.classList.add('travel'); bub.classList.add('hide');
    if (!tab) { go(view); setTimeout(()=>{ ov.classList.remove('travel'); S.coachBusy=false; done(); }, 350); return; }
    const r=tab.getBoundingClientRect(), pad=4;
    Object.assign(spot.style, { left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px', borderRadius:'14px', opacity:'1' });
    let tap=ov.querySelector('.coach-tap'); if (!tap) { tap=document.createElement('i'); tap.className='coach-tap'; ov.appendChild(tap); }
    tap.style.left=(r.left+r.width/2)+'px'; tap.style.top=(r.top+r.height/2)+'px';
    setTimeout(()=>{ tap.classList.remove('go'); void tap.offsetWidth; tap.classList.add('go'); tab.classList.add('coach-press'); haptic(); }, REDUCED ? 0 : 450);
    setTimeout(()=>{ tab.classList.remove('coach-press'); go(view); }, REDUCED ? 200 : 950);
    setTimeout(()=>{ ov.classList.remove('travel'); S.coachBusy=false; done(); }, REDUCED ? 450 : 1350);
  });
}
function startCoach(){
  S.coachScrolled=null; S.coachKey='';
  closeSheet(true); document.body.classList.remove('fabs-away');
  let ov=document.getElementById('coach');
  if (!ov) { ov=document.createElement('div'); ov.id='coach'; ov.className='coach';
    ov.innerHTML='<div class="coach-spot"></div><div class="coach-bub" role="dialog" aria-modal="true" aria-live="polite"></div>'; document.body.appendChild(ov);
    // Tapping the spotlighted item (like the Team Tasks tab) moves the tour on, just like Next.
    ov.addEventListener('click', e=>{
      if (e.target.closest('.coach-bub') || S.coach==null) return;
      const el=coachTarget(COACH[S.coach]), r=el && el.getBoundingClientRect();
      if (r && r.width && e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom) {
        if (S.coachBusy) return; if (S.coach>=COACH.length-1) endCoach(); else { haptic(); S.coach++; showCoach(true); }
      }
    }); }
  ov.hidden=false; document.body.classList.add('coach-on'); S.coach=0; showCoach();
}
function endCoach(){ const ov=document.getElementById('coach'); if (ov) ov.hidden=true; document.body.classList.remove('coach-on'); S.coach=null; if (S.view!=='home') go('home'); setTimeout(maybePushAsk, 600); }
function showCoach(fwd){
  const st=COACH[S.coach]; if (!st) return endCoach();
  if (st.view==='meetings' && S.mtab && S.mtab!=='meetings') { S.mtab='meetings'; if (S.view==='meetings') render(); }   // the tour shows the Meetings list
  if (st.view && S.view!==st.view) { if (fwd) { coachTravel(st.view).then(()=>showCoach(false)); return; } go(st.view); }
  document.querySelector('#coach .coach-bub').classList.remove('hide');
  const i=S.coach, last=i===COACH.length-1, bub=document.querySelector('#coach .coach-bub');
  bub.innerHTML='<div class="coach-dots" aria-label="Step '+(i+1)+' of '+COACH.length+'">'+COACH.map((x,j)=>'<i class="'+(j===i?'on':'')+'"></i>').join('')+'</div><h3>'+st.h+'</h3>'+st.b
    +'<div class="coach-acts"><button type="button" class="linkbtn" data-act="coach-done">'+(last?'':'Skip Tour')+'</button><span class="sp"></span>'
    +(i?'<button type="button" class="btn ghost sm" data-act="coach-back">Back</button>':'')
    +'<button type="button" class="btn primary sm" data-act="'+(last?'coach-done':'coach-next')+'">'+(last?'Get Started':'Next')+'</button></div>';
  // Lists load in a moment after a tab change, so place the bubble after the screen has drawn.
  S.coachKey=''; placeCoach(); coachFollow();
}
// Nov 17 (Brayden: on the iPhone the rings were far from the buttons at the top): after a step shows, the ring keeps
// following its target for 1.6 s (and on every scroll), because on a phone the page can still be loading, the pinned title
// row settling, or the list redrawing (a fresh element) after the first measurement.
function coachFollow(){
  cancelAnimationFrame(S.coachRaf); const until=performance.now()+1600;
  const tick=()=>{ if (S.coach==null) return; if (!S.coachBusy) placeCoach(true); if (performance.now()<until) S.coachRaf=requestAnimationFrame(tick); };
  S.coachRaf=requestAnimationFrame(tick);
}
window.addEventListener('scroll', ()=>{ if (S.coach!=null && !S.coachBusy) requestAnimationFrame(()=>placeCoach(true)); }, { passive:true });
// Pinned things (the title row with its search, sort and initials, the bottom bar, Alfred) don't move with the page.
function coachPinned(el){ for (let e=el; e && e!==document.body; e=e.parentElement){ const p=getComputedStyle(e).position; if (p==='fixed' || p==='sticky') return true; } return false; }
function coachTarget(st){ return st.sel ? [...document.querySelectorAll(st.sel)].find(e=>{ const r=e.getBoundingClientRect(); return r.width>0 && r.height>0; }) : null; }
function topSafe(){
  let p=document.getElementById('topSafeProbe');
  if (!p) { p=document.createElement('div'); p.id='topSafeProbe'; p.style.cssText='position:fixed;left:0;top:var(--top-safe);width:1px;height:1px;visibility:hidden;pointer-events:none'; document.body.appendChild(p); }
  return p.getBoundingClientRect().top || 12;
}
function placeCoach(follow){
  if (S.coach==null) return;
  const st=COACH[S.coach], ov=document.getElementById('coach'); if (!ov || ov.hidden) return;
  const spot=ov.querySelector('.coach-spot'), bub=ov.querySelector('.coach-bub'), W=innerWidth, H=innerHeight, pad=6;
  let el=coachTarget(st);
  // Scroll a target into view once per step (not while following), instantly, and never for pinned things.
  if (el && S.coachScrolled!==S.coach && !coachPinned(el) && !el.closest('nav')) {
    const r0=el.getBoundingClientRect(); S.coachScrolled=S.coach;
    if (r0.top<topSafe()+70 || r0.bottom>H-160) { window.scrollTo({ top:Math.max(0, window.scrollY + r0.top - H*0.3), behavior:'instant' }); el=coachTarget(st); }
  }
  if (follow && el) { const k=el.getBoundingClientRect(), key=[k.left,k.top,k.width,k.height].map(Math.round).join(',')+'|'+W+'x'+H; if (key===S.coachKey) return; S.coachKey=key; }
  const r=el && el.getBoundingClientRect();
  // Critique 4 layout #15: the ring never starts in the faded strip under the clock.
  if (r) { const big=r.width>W*0.6, sTop=Math.max(topSafe(), r.top-pad); Object.assign(spot.style, { left:(r.left-pad)+'px', top:sTop+'px', width:(r.width+pad*2)+'px', height:(r.bottom+pad-sTop)+'px',
      borderRadius:(el.matches('.circ, .alf-fab, #fab, .print-btn, .pdot')?'999px':big?'14px':'12px'), opacity:'1' }); }
  else Object.assign(spot.style, { left:(W/2)+'px', top:(H/2)+'px', width:'0px', height:'0px', opacity:'1' });
  const bw=Math.min(340, W-32), bh=bub.offsetHeight; bub.style.width=bw+'px';
  let top, left, arrow='';
  if (r) {
    const below=r.bottom+pad+14, above=r.top-pad-14-bh;
    const ts=topSafe();
    if (below+bh < H-12) { top=below; arrow='up'; } else if (above>ts) { top=above; arrow='down'; } else { top=Math.max(ts, H-bh-12); }
    left=Math.min(Math.max(16, r.left+r.width/2-bw/2), W-bw-16);
    bub.style.setProperty('--ax', Math.min(Math.max(20, r.left+r.width/2-left), bw-20)+'px');
  } else { top=Math.max(topSafe(), (H-bh)/2); left=(W-bw)/2; }
  bub.className='coach-bub'+(arrow?' arrow-'+arrow:'');
  bub.style.top=top+'px'; bub.style.left=left+'px';
}
window.addEventListener('resize', ()=>{ if (S.coach!=null) requestAnimationFrame(placeCoach); });
function busy(){
  const a=document.activeElement;
  return document.hidden || S.sheet || S.pending>0 || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
// The list on screen (Meetings, Decisions, Parking Lot or Marketing) is fetched again at most once a minute while it's open;
// it redraws only when something changed and nobody is typing or has a panel open.
function refreshOpenList(){
  if (refreshOpenList.busy) return;
  const now=Date.now(), view=S.view, tab=S.mtab||'meetings';
  let job=null;
  if (view==='home' && !sampleOn() && now-(S.scAt||0)>=55000)   // Nov 17: the Team Scorecard, read from its sheet every 5 minutes
    job=call('apiScorecard').then(r=>{ S.scAt=Date.now(); if (JSON.stringify(r)!==JSON.stringify(S.data.scorecard)) { S.data.scorecard=r; saveBoot(); return true; } });
  else if (view==='marketing' && S.mkt && S.mktFrom==='live' && now-(S.mktAt||0)>=55000)
    job=call('apiMarketing').then(r=>{ const same=JSON.stringify(r)===JSON.stringify(S.mkt); S.mktAt=Date.now(); if (!same) { S.mkt=r; return true; } });
  else if (view==='meetings' && now-(S.mtgSyncAt||S.listsAt||0)>=55000) {
    if (tab==='decisions' && S.decisions) job=call('apiDecisions').then(r=>{ const same=JSON.stringify(r)===JSON.stringify(S.decisions); S.mtgSyncAt=Date.now(); if (!same) { S.decisions=r; saveLists(); return true; } });
    else if (tab==='topics' && S.topics) job=call('apiTopics').then(r=>{ const same=JSON.stringify(r)===JSON.stringify(S.topics); S.mtgSyncAt=Date.now(); if (!same) { S.topics=r; saveLists(); return true; } });
    else if (tab==='meetings' && S.meetings && !S.mq) job=Promise.all([call('apiMeetings'), call('apiLiveLogs')]).then(r=>{ const was=JSON.stringify([S.meetings, S.liveLogs]); setMeetingLists(r); S.mtgSyncAt=Date.now(); if (JSON.stringify([S.meetings, S.liveLogs])!==was) { saveLists(); return true; } });
  }
  if (!job) return;
  refreshOpenList.busy=true;
  job.then(changed=>{ if (changed && S.view===view && !busy() && !S.touching) render(); else updateSynced(); }).catch(()=>{}).then(()=>{ refreshOpenList.busy=false; });
}
async function refresh(){
  if (!S.data) return;
  if (S.stale) { retryStale(); return; }   // bug #1
  if (S.touching) return;   // bug #3: never redraw the list under a finger that's mid-swipe
  if (S.outbox.length) { flushOutbox(); return; }   // send waiting changes first, so the list doesn't flip back
  if (busy() || !navigator.onLine) return;
  try {
    refreshOpenList();
    const tasks = await call('apiTasks');
    S.lastSync = Date.now(); updateSynced();
    if (busy() || JSON.stringify(tasks)===JSON.stringify(S.data.tasks)) return;
    S.data.tasks = tasks; saveBoot(); render();
  } catch(e) {}
}

/* ---------- offline: a gray bar, and status changes wait on this phone until the connection is back (ER-4) ---------- */
function updateOffline(){
  const el=document.getElementById('offline'); if (!el) return;
  const n=S.outbox.length, off=!navigator.onLine;
  el.hidden = !off && !n;
  el.textContent = (off?'Offline. ':'No connection. ')+(n?n+' change'+(n===1?'':'s')+' will':'Changes will')+' send when you reconnect.';
}
function saveOutbox(){ try { localStorage.setItem('lt-outbox', JSON.stringify(S.outbox)); } catch(e){} updateOffline(); }
function queueStatus(t){
  if (isTmp(t.id)) { queueEdit(t); return; }   // a task added offline: the status rides along with it
  S.outbox=S.outbox.filter(x=>!(x.id===t.id && (!x.kind || x.kind==='status'))).concat([{ id:t.id, title:t.title, status:t.status }]); saveOutbox();
}
// Offline, every change waits on this phone and sends in order once the connection is back: status changes, task edits,
// new tasks (shown right away with a temporary id) and comments.
// DI-2: a one-time id made when the person taps Add or Post; the server ignores a second copy with the same id.
// BUG-3: on tactical day "Next Week" is the same date as "Next Tactical"; show that date once (and any repeated date once).
function docUrl(u){ u=String(u||''); return /^https:\/\/(docs|drive)\.google\.com\//.test(u) || /^https:\/\/otter\.ai\//.test(u) ? u : ''; }
// #14 (Nov 16): the same date shortcuts everywhere: Today, Tomorrow, Next Tactical (and Clear Date when there is one).
function dateChips(cur, act, withToday, extra){
  const list=quickDates([withToday?['Today',S.data.today]:null, ['Tomorrow',addDays(S.data.today,1)], ['Next Tactical',S.data.defaultDue]].filter(Boolean));
  return list.map(([l,v])=>'<button type="button" class="'+(cur===v?'on':'')+'" data-act="'+act+'" data-val="'+v+'"'+(extra||'')+'>'+l+(l==='Next Tactical'?' · '+esc(short(v)):'')+'</button>').join('')
    +(cur && act==='due-quick' ? '<button type="button" data-act="'+act+'" data-val="">Clear Date</button>' : '');
}
function quickDates(list){ const seen={}; return list.filter(([l,v])=>{ if (v==='' ) return true; if (seen[v]) return false; seen[v]=1; return true; }); }
function newCid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
// DI-1: the fields of a task panel that changed since it opened (or since the last save), plus the id.
const TASK_FIELDS=['title','details','owners','status','priority','due','private','waiting_on','area'];
function taskChanges(base, now){ const c={ id:now.id }; TASK_FIELDS.forEach(f=>{ if (String(now[f]==null?'':now[f])!==String(base[f]==null?'':base[f])) c[f]=now[f]; }); return c; }
function isTmp(id){ return String(id||'').indexOf('tmp-')===0; }
function queueEdit(t){
  const copy=Object.assign({}, t);
  const nu=S.outbox.find(x=>x.kind==='new' && x.tmp===copy.id);
  if (nu) nu.task=Object.assign(nu.task, copy);
  else { const prev=S.outbox.find(x=>x.kind==='edit' && x.id===copy.id);
    if (prev) { prev.task=Object.assign(prev.task, copy); if (copy.title) prev.title=copy.title; }
    else S.outbox.push({ kind:'edit', id:copy.id, title:copy.title||(find(copy.id)||{}).title||'', task:copy }); }
  saveOutbox(); updateOffline();
}
function queueNew(t){
  const tmp='tmp-'+Date.now().toString(36), local=Object.assign({}, t, { id:tmp, created_at:S.data.today, updated_at:S.data.today });
  S.data.tasks.push(local); S.outbox.push({ kind:'new', tmp:tmp, title:t.title, task:Object.assign({}, t) }); saveOutbox(); updateOffline();
  return local;
}
function queueComment(id, text, title, cid){ S.outbox.push({ kind:'comment', id:id, title:title||'', text:text, cid:cid||newCid() }); saveOutbox(); updateOffline(); }
async function flushOutbox(){
  if (!S.data || !navigator.onLine || S.flushing || !S.outbox.length) return;
  S.flushing=true; let sent=0;
  for (const x of S.outbox.slice()) {
    try {
      if (x.kind==='new') {
        const saved=await call('apiSaveTask', Object.assign({}, x.task, { id:'' }));
        S.data.tasks=S.data.tasks.filter(t=>t.id!==x.tmp); replaceTask(saved);
        S.outbox.forEach(y=>{ if (y.id===x.tmp) y.id=saved.id; });   // later changes to it now point at the real task
        if (S.edit && S.edit.task.id===x.tmp) S.edit.task.id=saved.id;
      } else if (x.kind==='edit') replaceTask(await call('apiSaveTask', Object.assign({}, x.task, { id:x.id })));
      else if (x.kind==='comment') await call('apiAddComment', x.id, x.text, x.cid);
      else replaceTask(await call('apiSaveTask', { id:x.id, status:x.status }));
      sent++; S.outbox=S.outbox.filter(y=>y!==x); saveOutbox();
    } catch(e) {
      if (isNetErr(e)) break;   // still no connection: keep it for later
      S.outbox=S.outbox.filter(y=>y!==x); saveOutbox();
      toast('Couldn\'t save "'+x.title.slice(0,40)+'": '+errText(e));
    }
  }
  S.flushing=false; updateOffline();
  if (sent) { toast(sent===1?'Your offline change was saved':'Your '+sent+' offline changes were saved'); render(); }
}
window.addEventListener('offline', updateOffline);
window.addEventListener('online', ()=>{ updateOffline(); flushOutbox(); retryStale(); });

// Nov 17 (Brayden): every tab that refreshes on its own shows when it last did, centered under the title: Huddle and
// Tasks (S.lastSync, every 20 seconds), Meetings, Decisions and Parking Lot (S.mtgSyncAt) and Marketing (S.mktAt) while
// you're on them (refreshOpenList). Sample data says nothing.
function syncedAt(){
  if (S.view==='meetings') return S.mtgSyncAt || S.listsAt || 0;
  if (S.view==='marketing') return S.mktFrom==='sample' ? 0 : (S.mktAt || 0);
  if (S.view==='home' && sampleOn()) return 0;
  return S.lastSync || 0;
}
// Nov 17 (Brayden): the note sits at the bottom of the page (like Mail), not under the title, so the switches and ＋ buttons
// never move from tab to tab. It's kept as the last thing in #main on the tabs that refresh on their own.
// Nov 17 (Brayden): on every page now except the live meeting (it updates every few seconds and has its own
// "Reconnecting…" pill). Pages without a list of their own (Account, Review, Recently Deleted…) show the app's last refresh.
const SYNC_SKIP={ live:1 };
function updateSynced(){
  const m=document.getElementById('main'); if (!m) return;
  let el=document.getElementById('synced');
  if (SYNC_SKIP[S.view] || S.tv) { if (el) el.remove(); return; }
  if (!el || el.parentNode!==m || el.nextElementSibling) { if (el) el.remove(); m.insertAdjacentHTML('beforeend', '<p class="synced foot-sync" id="synced" role="status"></p>'); el=document.getElementById('synced'); }
  if (S.sample) { if (!el.querySelector('[data-act="sample-off"]')) el.innerHTML='Sample data · nothing is saved · <button type="button" class="linkbtn" data-act="sample-off">Turn Off</button>'; return; }
  const at=syncedAt(); if (!at) { el.textContent=''; return; }
  const mins=Math.floor((Date.now()-at)/60000), ago=mins<1 ? 'just now' : mins<60 ? mins+' min ago' : Math.floor(mins/60)+' hr ago';
  el.textContent = (!navigator.onLine ? 'Offline · updated ' : 'Updated ')+ago;
}
// Runs 4x a second: the live meeting timers, plus the "Updated" note every few seconds.
function tick(){
  tick.n=(tick.n||0)+1; if (tick.n%20===0) updateSynced();
  liveTick();
}

/* ---------- navigation ---------- */
function renderNav(){
  const rc=S.data.tasks.filter(t=>t.status==='Needs Review').length;
  const badgeFor = k=>rc && S.data.isApprover ? '<span class="count" data-num="'+k+'">'+rc+'</span>' : '';
  renderMe(rc && S.data.isApprover ? rc : 0);
  // LB-11: on a computer, Change Requests, Recently Deleted, Settings and Account live in one labeled More menu.

// ("4 of 5 On Track") with one line on what's close or behind, then a big-number tile per measure: a trend line with the

// Items: { name, value, goal, exampleGoal, better:'up'|'down', unit, unitNote, viz, trend:[…oldest→newest], note, foot, sample }.
const ENPS_BANDS=[[-100,0,'Trouble'],[0,10,'Positive'],[10,30,'Good'],[30,50,'Strong'],[50,101,'Excellent']];
function enpsBand(v){ return ENPS_BANDS.find(b=>v>=b[0] && v<b[1]) || ENPS_BANDS[0]; }
// Nov 23 (Brayden): all five measures always show. Without numbers a tile reads 0 with a flat line or an empty meter, and
// "Nothing here yet". The server sends them that way; this list covers a phone whose copy has none.
const SC_MEASURES=[{ name:'Completed Cases', better:'up', viz:'trend' }, { name:'Turnover Rate', unit:'%', better:'down', viz:'trend' }, { name:'eNPS', better:'up', viz:'enps' },
  { name:'Team Judgment', better:'up', viz:'scale5', unitNote:'of 5' }, { name:'Profitability', better:'up', viz:'percentile', unit:'th', unitNote:'pctl' }];
function scItems(){
  const have=(S.data.scorecard && S.data.scorecard.items) || [];
  return SC_MEASURES.map(m=>have.find(x=>x.name===m.name) || Object.assign({}, m, { value:0, empty:true }, m.viz==='trend' ? { trend:[0,0] } : {}))
    .concat(have.filter(x=>!SC_MEASURES.some(m=>m.name===x.name)));
}
function scoreState(x){
  if (x.empty) return '';
  const v=Number(x.value); if (!isFinite(v)) return '';
  if (x.viz==='enps' && (x.goal==null || x.goal==='')) return v>=10 ? 'on' : v>0 ? 'near' : 'off';
  const g=Number(x.goal); if (x.goal==null || x.goal==='' || !isFinite(g)) return '';
  const ok=x.better==='down' ? v<=g : v>=g; if (ok) return 'on';
  return Math.abs(v-g)<=Math.abs(g||1)*0.1 ? 'near' : 'off';
}
function fmtNum(v, unit){ v=Number(v); const n=Math.round(v*10)/10; return String(n)+(unit==='th' ? (n%100>=11 && n%100<=13 ? 'th' : ({1:'st',2:'nd',3:'rd'}[n%10]||'th')) : (unit||'')); }
function scTrend(t, goal, st){
  const W=124, H=34, p=4, all=t.concat(goal!=null?[goal]:[]), lo=Math.min(...all), hi=Math.max(...all), span=(hi-lo)||1;
  const X=i=>p+(W-2*p)*i/Math.max(1,t.length-1), Y=v=>H-p-(H-2*p)*(v-lo)/span, pts=t.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' '), last=t.length-1;
  return '<svg class="t-viz" viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none" aria-hidden="true">'
    +'<polygon points="'+X(0).toFixed(1)+','+(H-p)+' '+pts+' '+X(last).toFixed(1)+','+(H-p)+'" class="sv-area"/>'
    +(goal!=null?'<line x1="'+p+'" x2="'+(W-p)+'" y1="'+Y(goal).toFixed(1)+'" y2="'+Y(goal).toFixed(1)+'" class="sv-goal" vector-effect="non-scaling-stroke"/>':'')
    +'<polyline points="'+pts+'" class="sv-line" vector-effect="non-scaling-stroke"/></svg>'
    +'<span class="t-dot '+st+'" style="left:calc('+(X(last)/W*100).toFixed(1)+'% - 4px); top:'+(Y(t[last])-4+6).toFixed(1)+'px"></span>';
}
function scEnps(v){
  const f=x=>(Math.max(-100,Math.min(100,x))+100)/2;
  return '<div class="t-band" aria-hidden="true">'+ENPS_BANDS.map((b,i)=>'<i class="b'+i+'" style="left:'+f(b[0])+'%;width:calc('+(f(Math.min(100,b[1]))-f(b[0]))+'% - 2px)"></i>').join('')
    +'<b style="left:'+f(v)+'%"></b></div><div class="t-scale"><span>−100</span><span>0</span><span>100</span></div>';
}
function scScale5(v){ return '<div class="t-dots" aria-hidden="true">'+[1,2,3,4,5].map(n=>'<i><em style="width:'+(Math.max(0,Math.min(1,v-(n-1)))*100)+'%"></em></i>').join('')+'</div>'; }
function scPct(v, goal){ return '<div class="t-pct" aria-hidden="true"><i style="width:'+Math.max(0,Math.min(100,v))+'%"></i>'+(goal!=null?'<b style="left:'+goal+'%"><span>Goal '+fmtNum(goal,'th')+'</span></b>':'')+'</div><div class="t-scale"><span>0</span><span>100</span></div>'; }
function scRing(states){
  const r=26, cir=2*Math.PI*r, n=Math.max(1,states.length), seg=cir/n, gap=n>1?4:0, on=states.filter(x=>x==='on').length;
  return '<svg class="sc-ring" viewBox="0 0 68 68" width="68" height="68" aria-hidden="true"><g transform="rotate(-90 34 34)">'
    +states.map((st,i)=>'<circle cx="34" cy="34" r="'+r+'" class="rs '+(st||'none')+'" stroke-dasharray="'+(seg-gap).toFixed(2)+' '+(cir-seg+gap).toFixed(2)+'" stroke-dashoffset="'+(-(i*seg)).toFixed(2)+'"/>').join('')
    +'</g><text x="34" y="40" text-anchor="middle">'+on+'/'+states.length+'</text></svg>';
}
function scorecardHtml(list, month, opts){
  opts=opts||{};
  const states=list.map(scoreState), on=states.filter(x=>x==='on').length, rated=states.filter(Boolean).length, empties=list.filter(x=>x.empty).length, unrated=list.length-rated-empties;
  const close=list.filter((x,i)=>states[i]==='near').map(x=>x.name), behind=list.filter((x,i)=>states[i]==='off').map(x=>x.name);
  const moved=list.filter(x=>x.viz==='trend' && (x.trend||[]).length>1).map(x=>({ x:x, d:Number(x.value)-Number(x.trend[x.trend.length-2]) })).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))[0];
  // Nov 17: measures without a goal aren't counted as on or off track ("2 have no goal yet").
  const sub=[month||'', !rated ? '' : behind.length ? listNames(behind)+(behind.length===1?' is':' are')+' behind' : close.length ? listNames(close)+(close.length===1?' is':' are')+' close' : unrated ? '' : 'Everything meets its goal',

    +(moved && moved.d ? '<br>'+esc(moved.x.name.split(' ')[0])+' '+(moved.d>0?'▲':'▼')+' '+fmtNum(Math.abs(moved.d), moved.x.unit==='th'?'':moved.x.unit)+' from last month' : '');

    const pill=x.viz==='enps' && !x.empty ? '<span class="t-pill '+st+'">'+enpsBand(v)[2]+'</span>' : chip(x);
    const foot=[x.viz==='percentile' && x.goal!=null && v<x.goal ? fmtNum(x.goal-v,'')+' points under goal' : goalTxt, x.foot||''].filter(Boolean).join('<br>');

    return '<div class="card sc-tile '+cls+'"'+tap+'><div class="t-name">'+esc(x.name)+' '+pill+'</div><div class="t-num">'+fmtNum(v, x.unit)+'<small>'+esc(small)+'</small></div><div class="t-viz-box">'+viz+'</div><div class="t-foot">'+foot+'</div></div>';

function daysBetween(a, b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5); }
function mkOffices(deliveries, old){
  const today=S.data.today, by={}, key=n=>String(n||'').trim().toLowerCase();
  (old||[]).forEach(o=>{ by[key(o.name)]=Object.assign({}, o, { last:'', next:'' }); });
  deliveries.forEach(d=>{ const k=key(d.office); if (!k) return; const o=by[k]||(by[k]={ name:d.office, visit_days:45, last:'', next:'' });
    if (d.status==='Delivered' && d.date && d.date>o.last) o.last=d.date;
    if (d.status==='Planned' && d.date && (!o.next || d.date<o.next)) o.next=d.date; });   // booked, even if it's running late
  return Object.keys(by).map(k=>{ const o=by[k], days=o.last ? daysBetween(o.last, today) : null; return Object.assign(o, { days_since:days, due:!o.next && (days==null || days>(Number(o.visit_days)||45)) }); })

// Nov 17 (Brayden): every trend line is the last 12 months, green when cases are trending up over the year, red when down,
// navy when flat (the slope of a straight line through the 12 months, at least 0.15 cases a month either way).
function refTrend(vals){ const n=vals.length; if (n<2) return ''; const mx=(n-1)/2, my=vals.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0; vals.forEach((v,i)=>{ num+=(i-mx)*(v-my); den+=(i-mx)*(i-mx); }); const sl=den ? num/den : 0; return sl>=0.15 ? 'g' : sl<=-0.15 ? 'r' : ''; }

function refSeries(r){ const R=S.mkt.referrals; return (r.p && r.p.length===12 ? r.p : new Array(12).fill(0)).concat(r.m.slice(0, R.last+1)).slice(-12); }
function refSpark(vals, cls){
  const w=76, h=26, lo=Math.min(...vals), hi=Math.max(...vals), sp=(hi-lo)||1;
  const pts=vals.map((v,i)=>(2+(w-4)*i/Math.max(1,vals.length-1)).toFixed(1)+','+(h-3-(h-6)*(v-lo)/sp).toFixed(1)).join(' ');
  return '<svg class="ref-spark '+(cls||'')+'" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polyline points="'+pts+'"/></svg>';

// What the panel's fields say now.
function mkRead(){
  const E=S.mk, x=Object.assign({}, E.item), v=id=>{ const el=document.getElementById(id); return el ? el.value : undefined; };
  if (E.kind==='delivery') { x.office=(v('mk-office')||'').trim(); if (E.item.doctor && x.office!==E.pickedOffice) x.doctor=''; x.date=v('mk-date')||''; x.gift=v('mk-gift')||''; x.cost=v('mk-cost')||''; x.notes=v('mk-notes')||''; }
  if (E.kind==='post') { x.title=(v('mk-title')||'').trim(); x.caption=v('mk-caption')||''; x.post_on=v('mk-date')||''; x.link=(v('mk-link')||'').trim(); x.notes=v('mk-notes')||''; }
  if (E.kind==='idea' && v('mk-text')!==undefined) { x.text=(v('mk-text')||'').trim(); x.details=v('mk-details')||''; }
  E.item=x; return x;
}
function mkErr(t){ const er=document.getElementById('f-err'); if (er) er.textContent=t; }
const MK_SAVE={ delivery:'apiSaveDelivery', post:'apiSavePost', idea:'apiSaveIdea' };
async function mkSave(el, extra, after){
  const E=S.mk; if (!E) return; const x=Object.assign(mkRead(), extra||{});
  if (E.kind==='delivery' && !x.office) return mkErr('Pick the office first.');
  if (E.kind==='post' && !x.title) return mkErr('Give the post a title first.');
  if (E.kind==='idea' && !x.text) return mkErr('Type the idea first.');
  if (E.isNew) x.cid=x.cid||newCid();
  const fromIdea=E.isNew && E.kind!=='idea' && S.mkFromIdea ? S.mkFromIdea.done : null;
  const r=await saving(el, E.isNew?'Adding…':'Saving…', ()=>mkCall(MK_SAVE[E.kind], x)); if (!r) return;
  mkPut(E.kind, r); const kind=E.kind;
  if (S.mk===E) closeSheet();
  if (fromIdea) fromIdea(r);
  if (after) after(r); else if (kind==='idea' && E.isNew) toast('Idea added. Thanks!');
  renderMkResults();
}
function mkDelete(el){
  const E=S.mk; if (!E) return; const kind=E.kind, id=E.item.id, fn={ delivery:'apiDeleteDelivery', post:'apiDeletePost', idea:'apiDeleteIdea' }[kind];
  saving(el, 'Deleting…', ()=>mkCall(fn, id)).then(r=>{ if (!r) return; mkDrop(kind, id); closeSheet(); renderMkResults();
    toast((kind==='delivery'?'Delivery':kind==='post'?'Post':'Idea')+' deleted', ()=>mkCall('apiRestoreMarketing', kind, id).then(row=>{ if (row && row.id) mkPut(kind, row); renderMkResults(); toast('Restored'); }).catch(e=>toast('Couldn\'t restore. '+errText(e))), { label:'Undo' }); });
}
function mkClick(a, el, v){

  if (a==='k-all-posted') { S.kAllPosted=true; renderMkResults(); return true; }

  if (a==='post-open') { const p=(S.mkt.posts||[]).find(x=>x.id===el.dataset.id); if (p) mkOpen('post', p); return true; }

  if (a==='k-task-new') { if (S.mktFrom==='sample') { toast('This is sample data. Turn it off in Account to add real tasks.'); return true; } newTask(); S.edit.task.area='marketing'; renderSheet(); return true; }
  if (a==='mk-pick') { mkRead(); const f=el.dataset.field; S.mk.item[f]= f!=='status' && S.mk.item[f]===v ? '' : v; renderSheet(); return true; }
  if (a==='mk-plat') { mkRead(); const on=String(S.mk.item.platforms||'').split(',').map(s=>s.trim()).filter(Boolean), i=on.indexOf(v); if (i>=0) on.splice(i,1); else on.push(v); S.mk.item.platforms=PLATS.map(p=>p[0]).filter(p=>on.indexOf(p)>=0).join(', '); renderSheet(); return true; }
  if (a==='mk-pick-doc') { const x=mkPickMatches((document.getElementById('mk-office')||{}).value)[Number(el.dataset.i)]; if (!x) return true;
    mkRead(); S.mk.item.office=x.office; S.mk.item.doctor=x.doctor; S.mk.pickedOffice=x.office; renderSheet(); return true; }
  if (a==='mk-doc-clear') { mkRead(); S.mk.item.doctor=''; renderSheet(); return true; }
  if (a==='mk-save') { mkSave(el); return true; }
  if (a==='mk-delivered') { mkSave(el, { status:'Delivered' }, ()=>toast('Marked delivered')); return true; }
  if (a==='mk-stage') { const to=v; mkSave(el, { stage:to }, ()=>toast(to==='Needs Approval' ? (mkIsApprover()?'Saved':'Sent to '+(firstName(mkApprover())||'the approver')+' for approval') : to==='Approved' ? 'Approved' : to==='Posted' ? 'Marked posted' : 'Saved')); return true; }
  if (a==='mk-sendback') { mkRead(); const note=window.prompt('What should change? (sent with the post)', ''); if (note===null) return true;
    mkSave(el, { stage:'Drafted', review_note:note.trim() }, ()=>toast('Sent back')); return true; }

  if (a==='idea-status') { mkSave(el, { status:v }, ()=>toast(v==='Archived'?'Archived':'Moved back to Open')); return true; }
  if (a==='idea-make') { const idea=S.mk.item, kind=v; closeSheet(true);
    const done=r=>{ if (!r) return; mkCall('apiSaveIdea', { id:idea.id, status:'Used', became:kind+':'+r.id }).then(ir=>{ mkPut('idea', ir); renderMkResults(); }).catch(()=>{}); };
    S.mkFromIdea={ done:done };
    if (kind==='post') { S.ktab='posts'; render(); mkOpen('post', { title:idea.text.slice(0,120), caption:idea.details||'', platforms:'', post_on:'', writer:S.data.me, stage:'Idea', link:'', notes:'' }, true); }

// The Marketing calls, run in memory (sample data and the preview). Same rules as the server, simplified.
function MkLocal(store){
  const now=()=>{ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.toISOString().slice(0,10)+' '+z(d.getHours())+':'+z(d.getMinutes()); };
  const id=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const live=r=>!r.deleted_at;
  const findIn=(k,x)=>(store[k]||[]).find(r=>r.id===x && live(r));
  const ap=()=>store.approver;
  return {
    apiMarketing(me){ const deliveries=store.deliveries.filter(live);
      return { deliveries:deliveries, posts:store.posts.filter(live), ideas:store.ideas.filter(live), offices:mkOffices(deliveries, []), approver:ap(), me:me, referrals:store.referrals||null, sheet:store.sheet||null, ramp:store.ramp||null, rampHist:store.rampHist||null }; },
    apiSaveDelivery(me, d){ const cur=d.id?findIn('deliveries', d.id):null; if (d.id && !cur) throw new Error('That delivery isn\'t there any more.');
      const out=cur||{ id:id('d'), created_at:now(), created_by:me }; if (!cur) store.deliveries.push(out);
      ['office','date','gift','who','notes','status','doctor'].forEach(k=>{ if (d[k]!=null) out[k]=String(d[k]); });
      if (d.cost!=null) { const c=String(d.cost).replace(/[$,\s]/g,''); out.cost=c && isFinite(Number(c)) ? String(Math.round(Number(c)*100)/100) : ''; }
      if (!out.status) out.status='Planned'; if (out.status==='Delivered' && !out.date) out.date=S.data.today;
      if (!out.office) throw new Error('Pick the office first.'); out.updated_at=now(); out.updated_by=me; return out; },
    apiDeleteDelivery(me, x){ const r=findIn('deliveries', x); if (r) { r.deleted_at=now(); r.deleted_by=me; } return { ok:true }; },
    apiSavePost(me, p){ const cur=p.id?findIn('posts', p.id):null; if (p.id && !cur) throw new Error('That post isn\'t there any more.');
      const out=cur||{ id:id('p'), created_at:now(), created_by:me, stage:'Idea', writer:me }; const isAp=me===ap(), from=cur?cur.stage:'';
      let changed=false; ['title','caption','link','platforms'].forEach(k=>{ if (p[k]!=null && String(p[k])!==String(out[k]||'')) { out[k]=String(p[k]); changed=true; } });
      ['post_on','writer','notes'].forEach(k=>{ if (p[k]!=null) out[k]=String(p[k]); });
      if (!out.title) throw new Error('Give the post a title first.');
      const to=p.stage!=null ? p.stage : (cur ? cur.stage : (out.caption?'Drafted':'Idea'));
      if (to!==from) { if (to==='Approved' && !isAp) throw new Error('Only '+firstName(ap())+' can approve posts.');
        if (to==='Approved') { out.approved_by=me; out.review_note=''; }
        if (to==='Drafted' && p.review_note!=null) out.review_note=String(p.review_note);
        if (to==='Posted') out.posted_at=now(); out.stage=to; }
      else if (changed && (from==='Approved' || from==='Needs Approval') && !isAp) out.stage='Needs Approval';
      if (!cur) store.posts.push(out); out.updated_at=now(); out.updated_by=me; return out; },
    apiDeletePost(me, x){ const r=findIn('posts', x); if (r) { r.deleted_at=now(); r.deleted_by=me; } return { ok:true }; },
    apiSaveIdea(me, i){ const cur=i.id?findIn('ideas', i.id):null; if (i.id && !cur) throw new Error('That idea isn\'t there any more.');
      if (cur && cur.suggested_by!==me && me!==ap()) throw new Error('Only '+firstName(cur.suggested_by)+' or '+firstName(ap())+' can change this idea.');
      const out=cur||{ id:id('i'), created_at:now(), suggested_by:me, likes:'', status:'Open', became:'' }; if (!cur) store.ideas.push(out);
      ['text','details','status','became'].forEach(k=>{ if (i[k]!=null) out[k]=String(i[k]); });
      if (!out.text) throw new Error('Type the idea first.'); out.updated_at=now(); out.updated_by=me; return out; },
    apiLikeIdea(me, x){ const r=findIn('ideas', x); if (!r) throw new Error('That idea isn\'t there any more.');
      const l=String(r.likes||'').split(',').filter(Boolean), i=l.indexOf(me); if (i>=0) l.splice(i,1); else l.push(me); r.likes=l.join(','); return r; },
    apiDeleteIdea(me, x){ const r=findIn('ideas', x); if (r) { r.deleted_at=now(); r.deleted_by=me; } return { ok:true }; },
    apiRestoreMarketing(me, kind, x){ const k={ delivery:'deliveries', post:'posts', idea:'ideas' }[kind]; const r=(store[k]||[]).find(z=>z.id===x); if (r) { r.deleted_at=''; r.deleted_by=''; } return r||{ ok:true }; }
  };
}

function filtered(){
  let tasks=scoped();
  if (S.priority) tasks=tasks.filter(t=>t.priority===S.priority);

  if (S.quick==='late') tasks=tasks.filter(isLate);
  const q=S.q.trim().toLowerCase();
  if (q) tasks=tasks.filter(t=>(t.title+' '+t.details+' '+owners(t).map(nameOf).join(' ')+' '+(t.source||'')).toLowerCase().indexOf(q)>=0);
  return tasks;

function sortTasks(list){
  const byDue=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999');
  const f={ due:(a,b)=>byDue(a,b)||PR[a.priority]-PR[b.priority], priority:(a,b)=>PR[a.priority]-PR[b.priority]||byDue(a,b),
            updated:(a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''), title:(a,b)=>a.title.localeCompare(b.title) }[S.sort];
  return list.slice().sort(f);
}

function sourceText(src){ const m=/^(\d{4}-\d{2}-\d{2}) (.*)$/.exec(src||''); return m ? m[2]+' · '+short(m[1]) : src; }
function meetingName(t){ const mt=t.meeting_id && S.data.meetings && S.data.meetings[t.meeting_id]; return mt ? (mt.title||mt.type) : sourceText(t.source).split(' · ')[0]; }

// The date under the title: "Thu" this week, "Nov 20" later, "Done Nov 8" once finished. Overdue dates are gray italics.
function dateLine(t){

// Owners' initials stacked top to bottom: the first owner on top, each one below tucked slightly under the one above.

function ownerStack(list){
  if (!list.length) return '';
  const chip=txt=>{ const fs=txt.length>2?9:10; return '<svg class="avatar more" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" stroke-width="2"/><text x="13" y="'+(13+fs*0.368).toFixed(1)+'" text-anchor="middle" font-size="'+fs+'">'+txt+'</text></svg>'; };
  const names=list.map(nameOf).join(', ');
  if (list.length>1 && list.length>=S.data.people.length) return '<span class="ostack" role="img" aria-label="Everyone">'+chip('All')+'</span>';
  const shown=list.length<=2 ? list : list.slice(0,1), extra=list.length-shown.length;   // layout #12: nothing hides under another circle
  return '<span class="ostack" role="img" aria-label="'+esc(names)+'">'+shown.map(o=>avatar(o,26)).join('')+(extra?chip('+'+extra):'')+'</span>';
