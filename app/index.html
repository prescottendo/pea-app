async function applyProposal(p){
  if (p.state!=='ready') return;
  p.error='';
  if (p.kind==='update') {
    const t=find(p.task_id);
    if (!t) { p.error='That task isn\'t in your list anymore (it may be done, deleted or private).'; renderAlfred(); return; }
    const keys=Object.keys(p.changes||{});
    if (keys.length===1 && keys[0]==='status') {   // the usual circle-tap path, with its Undo
      setStatus(t.id, p.changes.status); p.state='done'; renderAlfred();
      const u=S.undo; if (u) S.undo=()=>{ u(); p.state='undone'; renderAlfred(); };
      return;
    }
    const prev=Object.assign({}, t);
    p.state='saving'; renderAlfred();
    try {
      const saved=await call('apiSaveTask', Object.assign({ id:t.id }, p.changes)); replaceTask(saved); render();
      p.state='done'; renderAlfred();
      toast('Saved', async()=>{ try { replaceTask(await call('apiSaveTask', Object.keys(p.changes).reduce((o,k)=>{ o[k]=prev[k]; return o; }, { id:prev.id }))); p.state='undone'; render(); renderAlfred(); toast('Changed back'); } catch(e){ toast('Couldn\'t undo. '+errText(e)); } });
    } catch(e){ p.state='ready'; p.error='Not saved: '+errText(e); renderAlfred(); }
    return;
  }
  if (p.kind==='event') {   // Nov 23: an invite from Huddle's calendar, with Undo
    p.state='saving'; renderAlfred();
    try { const r=await call('apiAlfredCalendarEvent', p.title, p.when, p.minutes, p.names); p.state='done'; renderAlfred();
      toast('On the calendar for '+listNames(r.names||[]), async()=>{ try { await call('apiAlfredCalendarUndo', r.id); p.state='undone'; renderAlfred(); toast('Event removed'); } catch(e){ toast('Couldn\'t undo. '+errText(e)); } }); }
    catch(e){ p.state='ready'; p.error='Not added: '+errText(e); renderAlfred(); }
    return;
  }
  if (p.kind==='email') {   // Nov 23: Alfred's draft is emailed to the people listed (team only), to edit and send themselves
    p.state='saving'; renderAlfred();
    try { const r=await call('apiAlfredEmailDraft', p.to, p.subject, p.body); p.state='done'; renderAlfred(); toast('Draft emailed to '+listNames((r&&r.sent)||[])); }
    catch(e){ p.state='ready'; p.error='Not sent: '+errText(e); renderAlfred(); }
    return;
  }
  if (p.each) {   // "add it to all of our lists": one task each
    p.state='saving'; renderAlfred();
    try {
      p.cids=p.cids||p.owners.map(()=>newCid());
      const made=[]; for (let k=0; k<p.owners.length; k++) { const saved=await call('apiSaveTask', Object.assign({}, p.task, { owners:p.owners[k], cid:p.cids[k] })); replaceTask(saved); made.push(saved.id); }
      render(); p.state='done'; renderAlfred();
      toast(made.length+' tasks added', async()=>{ try { for (const id of made) { await call('apiDeleteTask', id); const i=S.data.tasks.findIndex(x=>x.id===id); if (i>=0) S.data.tasks.splice(i,1); } S.deleted=null; p.state='undone'; render(); renderAlfred(); toast('Removed'); } catch(e){ toast('Couldn\'t undo. '+errText(e)); } });
    } catch(e){ p.state='ready'; p.error='Not added: '+errText(e); renderAlfred(); }
    return;
  }
  p.state='saving'; renderAlfred();
  try {
    p.cid=p.cid||newCid();
    const saved=await call('apiSaveTask', Object.assign({}, p.task, { cid:p.cid })); replaceTask(saved); render();
    p.state='done'; p.id=saved.id; renderAlfred();
    toast('Task added', async()=>{ try { await call('apiDeleteTask', saved.id); const i=S.data.tasks.findIndex(x=>x.id===saved.id); if (i>=0) S.data.tasks.splice(i,1); S.deleted=null; p.state='undone'; render(); renderAlfred(); toast('Removed'); } catch(e){ toast('Couldn\'t undo. '+errText(e)); } });
  } catch(e){ p.state='ready'; p.error='Not added: '+errText(e); renderAlfred(); }
}

// What the server gets: each message's text, with that moment's screen context appended to the person's messages.
function apiHistory(){
  return S.alf.msgs.filter(m=>(m.role==='user' && !m.failed) || (m.role==='assistant' && m.text)).map(m=>({ role:m.role, text:m.api||m.text, shot:!!m.shot }));
}
async function sendAlfred(text, retryIndex){
  const A=S.alf; if (A.sending) return;
  const epoch=A.epoch||0;
  let msg;
  if (retryIndex!=null) { msg=A.msgs[retryIndex]; if (!msg) return; msg.failed=false; msg.error=''; }
  else {
    text=String(text||'').trim(); if (!text) return;
    const ctx=appContext();
    msg={ role:'user', text:text, api:text+'\n\n<app_context>\n'+JSON.stringify(ctx)+'\n</app_context>', ctx:ctx };
    A.lastCtx=ctx; A.msgs.push(msg); if (!A.chatId) A.chatId='c'+Date.now();
  }
  A.sending=true; A.scrollDown=true; A.progress=''; renderAlfred();
  // The screenshot is taken while the panel opens (Batch 3); a quick first message waits for it here.
  if (retryIndex==null) {
    if (A.shotP) { try { await A.shotP; } catch(e){} }
    if ((A.epoch||0)!==epoch) return;   // bug #16
    if (A.shot && !A.shotUsed) { A.msgs.forEach(m=>{ m.shot=false; }); msg.shot=true; A.shotUsed=true; }
  }
  // While Alfred works, ask every 1.5 seconds what it's doing ("Searching meetings…").
  const pid=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const poll=setInterval(()=>{ call('apiAlfredProgress', pid).then(t=>{ if (A.sending && t && t!==A.progress) { A.progress=t; const el=document.getElementById('alfProg'); if (el) el.textContent=t; } }).catch(()=>{}); }, 1500);
  try {
    const shotMsg=A.msgs.find(m=>m.shot);
    const r=await call('apiAlfredChat', apiHistory(), shotMsg ? A.shot : '', pid);
    if ((A.epoch||0)!==epoch) { clearInterval(poll); return; }   // the chat was closed and started fresh meanwhile
    if (r.error) { msg.failed=true; msg.error=r.error; }
    else A.msgs.push({ role:'assistant', text:r.reply||'', drafts:(r.drafts||[]).map(d=>Object.assign({}, d, { state:'draft', shotState:A.shot?'yes':'none', ctx:A.lastCtx })),
      proposals:(r.proposals||[]).map(p=>Object.assign({}, p, { state:'ready' })) });
  } catch(e) { clearInterval(poll); if ((A.epoch||0)!==epoch) return; msg.failed=true; msg.error='Could not reach Alfred: '+errText(e); }   // bug #16: a closed chat's failure leaves the new chat alone
  clearInterval(poll);
  A.sending=false; A.progress=''; A.scrollDown=true; renderAlfred();
}
async function submitDraft(d){
  if (d.state==='sending') return;
  if (!String(d.title||'').trim() || !String(d.description||'').trim()) { d.error='Add a title and say what\'s wrong or what you\'d like.'; renderAlfred(); return; }
  d.state='sending'; d.error=''; renderAlfred();
  try {
    const shot=d.shotState!=='removed' ? (S.alf.shot||'') : '';
    const saved=await call('apiSubmitChangeRequest', { type:d.type, title:d.title, description:d.description, acceptance:d.acceptance }, d.ctx||appContext(), shot);
    d.state='sent'; d.id=saved.id; S.requests=null;
  } catch(e) { d.state='draft'; d.error='Not sent: '+errText(e); }
  renderAlfred();
}
// Returns true when the click was one of Alfred's.
function alfredClick(a, el){
  if (!/^alf-/.test(a)) return false;
  const A=S.alf, d=draftAt(el);
  if (a==='alf-open') openAlfred();
  else if (a==='alf-close') closeAlfred();
  else if (a==='alf-new') alfNew(el);
  else if (a==='alf-mic') alfMic();
  else if (a==='alf-send') { if (DICT.rec) dictStop(); const b=document.getElementById('alfInput'); const t=b.value; b.value=''; autoGrow(b); sendAlfred(t); }
  else if (a==='alf-suggest') sendAlfred(el.dataset.val);
  else if (a==='alf-history') { S.alf.view='history'; renderAlfred(); }
  else if (a==='alf-hist-back') { S.alf.view=null; renderAlfred(); }
  else if (a==='alf-past') { if (el.dataset.moved) return; const w=el.closest('.chat-swipe.open'); if (w) { w.classList.remove('open'); el.style.transform=''; return; } openPastChat(el.dataset.id, el); }
  else if (a==='alf-chat-del') chatDelete(el.dataset.id);
  else if (a==='alf-requests') { closeAlfred(); go('requests', TAB_VIEWS[S.view] || 'Back'); }   // #19: your requests live with Alfred
  else if (a==='alf-retry') sendAlfred('', Number(el.dataset.val));
  else if (a==='alf-pick') startPick();
  else if (a==='alf-pick-cancel') { endPick(); showAlfred(); }
  else if (a==='alf-task') { const id=el.dataset.id; if (find(id)) closeAlfred().then(()=>openTask(id)); else toast('That task isn\'t in your list (it may be done, deleted or private).'); }
  else if (a==='alf-meeting') { const id=el.dataset.id; closeAlfred().then(()=>openMeeting(id)); }
  else if (a==='alf-d-type' && d) { d.type=el.dataset.val; renderAlfred(); }
  else if (a==='alf-d-edit' && d) { d.state=d.state==='editing'?'draft':'editing'; renderAlfred(); }
  else if (a==='alf-d-shot' && d) { d.shotState=el.dataset.val; renderAlfred(); }
  else if (a==='alf-d-retake' && d) { d.shotState='yes'; retakeShot(); }
  else if (a==='alf-d-send' && d) { if (d.state==='editing') d.state='draft'; submitDraft(d); }
  else if (a==='alf-p-ok') { const p=proposalAt(el); if (p) applyProposal(p); }
  else if (a==='alf-p-no') { const p=proposalAt(el); if (p && p.state==='ready') { p.state='cancelled'; renderAlfred(); } }
  return true;
}
// Nov 16: a hidden box (Alfred closed) measures 0, which used to squeeze it so the hint fell out the bottom. Hidden or
// empty, it goes back to its natural one-line height.
function autoGrow(b, max){ if (!b.getClientRects().length || !b.value) { b.style.height=''; b.style.overflowY='hidden'; return; } b.style.height='auto'; const bw=(b.offsetHeight-b.clientHeight)||0, h=b.scrollHeight+bw, cap=max||140; b.style.height=Math.min(h, cap)+'px'; b.style.overflowY=h>cap?'auto':'hidden'; }
document.addEventListener('input', e=>{
  if (e.target.id==='alfInput') { autoGrow(e.target); return; }
  if (e.target.id==='f-title' || e.target.id==='lv-title') { autoGrow(e.target, 240); }
  const f=e.target.dataset && e.target.dataset.alfField; if (!f) return;
  const d=draftAt(e.target); if (d) d[f]=e.target.value;
});
document.addEventListener('keydown', e=>{

}, true);

S.reqUi={};
function requestClick(a, el){

// In-place animation for taps in panels and on switch pills (Nov 10). Chips and buttons that change color fade from their old
// colors to the new ones and give a small pop; the pill's highlight slides (placeSegs); a pill that swaps the content below it
// fades that content in. Uses the Web Animations API, so it works without View Transitions.
function softAct(fn, box, fadeContent, tapped){
  const keyOf=b=>[b.dataset.act, b.dataset.email||b.dataset.val||b.dataset.field||b.dataset.id||'', b.textContent.trim().slice(0,40)].join('|');
  // Only the tapped control's own group (its chips, pill or card) is compared and animated (MO-B16, MO-B18).
  const GROUP='.chips, .seg, .quick-dates, .mm-seg, .set-card, .people';
  const grp=tapped && tapped.closest(GROUP), act=tapped && tapped.dataset.act;
  const pick=root=>{ if (!root) return []; if (!grp) return [...root.querySelectorAll('button[data-act]')].filter(b=>b.dataset.act===act);
    const all=[...root.querySelectorAll(GROUP)].filter(g=>g.className===grp.className && g.querySelector('[data-act="'+act+'"]'));
    return all.reduce((a,g)=>a.concat([...g.querySelectorAll('button[data-act]')]), []); };
  const before=new Map();
  pick(box).forEach(b=>{ const cs=getComputedStyle(b); before.set(keyOf(b), [cs.backgroundColor, cs.color, cs.borderColor]); });
  fn();
  const now=document.getElementById(box && box.id) || box;
  if (!now || !now.animate) return;
  const ease='cubic-bezier(.2,.8,.2,1)';
  pick(now).forEach(b=>{
    const old=before.get(keyOf(b)); if (!old) return;
    const cs=getComputedStyle(b); if (old[0]===cs.backgroundColor && old[1]===cs.color && old[2]===cs.borderColor) return;
    if (b.closest('.seg')) return;   // the pill's own highlight slides instead
    b.animate([{ backgroundColor:old[0], color:old[1], borderColor:old[2], transform:'scale(.94)' },
               { backgroundColor:cs.backgroundColor, color:cs.color, borderColor:cs.borderColor, transform:'scale(1)' }], { duration:240, easing:ease });
  });
  if (fadeContent) {
    const seg=now.querySelector('.seg'); let after=false;
    [...now.children].forEach(c=>{
      if (seg && c.contains(seg)) { after=true; return; }
      if (after) c.animate([{ opacity:0, transform:'translateY(6px)' }, { opacity:1, transform:'none' }], { duration:240, easing:ease });
    });
  }
}

/* ---------- Huddle's own web address (window.HUDDLE_WEB) ---------- */
// The page is served from GitHub Pages (web/build.mjs adds window.HUDDLE_WEB = { api, clientId, build }) and talks to the
// same Apps Script project through doPost. The person signs in once with Google; the server checks that sign-in and gives
// back a Huddle session token, kept in this browser (lt-session) and sent with every call. When the server says the
// session is over ({auth:true}), the sign-in screen comes back. Nothing here runs on the old Google address or the preview.
const WEB_KEYS = { token:'lt-session', me:'lt-me' };
// Lists saved on this device for the signed-in person. They go when someone signs out or a different person signs in.
const WEB_PERSONAL = ['lt-boot','lt-lists','lt-seen','lt-alf-history','lt-drafts','lt-mtg','lt-push','lt-task-seen','lt-team-seen','lt-act-seen'];   // Critique 4 (Sec #4)
function webToken(){ try { return localStorage.getItem(WEB_KEYS.token)||''; } catch(e){ return ''; } }
function webForget(keys){ keys.forEach(k=>{ try { localStorage.removeItem(k); } catch(e){} }); }
// One POST to the Apps Script web app. text/plain keeps it a "simple" request (no CORS preflight); Google answers with a
// redirect to its content server, which fetch follows. No cookies are sent: the Huddle token is the only sign-in.
// Nov 23 (Brayden #8): a request that never answers (a phone asleep mid-request, Wi-Fi to cellular) used to leave the
// meeting check "busy" for good, so that phone stopped following the meeting. Meeting reads give up after 10 seconds,
// everything else after 60, and count as a dropped connection (the outbox retries those).
const WEB_WAIT={ apiLiveGet:10000 };
function webPost(body){
  // Nov 23: the test copy marks its calls, so the Cloudflare server can refuse the real app's until the switch (a phone still
  // holding the rehearsal's copy of the page would otherwise save into the test database).
  if (WEB && WEB.tryout) body=Object.assign({ tryout:1 }, body);
  const ac=typeof AbortController==='function' ? new AbortController() : null;
  const t=ac ? setTimeout(()=>ac.abort(), WEB_WAIT[body.fn]||60000) : 0;
  return fetch(WEB.api, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(body),
    redirect:'follow', credentials:'omit', cache:'no-store', signal:ac ? ac.signal : undefined })
    .finally(()=>clearTimeout(t))
    .catch(()=>{ throw new Error('NetworkError: Connection failure'); })   // Safari says "Load failed"; the outbox looks for this
    .then(res=>{ if (!res.ok) throw new Error(res.status===429 ? 'Google is busy right now. Try again in a minute.' : 'NetworkError: Connection failure due to HTTP '+res.status); return res.text(); })
    .then(text=>{ try { return JSON.parse(text); } catch(e){ throw new Error('Huddle\'s server sent an answer the app can\'t read. Try again in a minute.'); } });

function webCall(fn, args){
  const fail=e=>{ if (typeof clientError==='function') clientError(e && e.message || e, fn); throw e; };
  const token=webToken();

  return webPost({ token, fn, args }).then(r=>{
    if (r && r.ok) return r.result;
    const e=new Error((r && r.error) || 'Something went wrong.');

    throw e;

// The app updates itself: sw.js keeps this page on the phone (instant open, works with no signal) and fetches a newer
// version in the background. When one is ready it applies right away if the app was only just opened, and otherwise
// offers "Update Ready · Reload" so nobody loses what they're typing.
function webServiceWorker(){
  if (!('serviceWorker' in navigator) || !/^https:|^http:\/\/localhost/.test(location.href)) return;
  // Nov 16 (Brayden): updates install themselves, with no message, at the next quiet moment: never while a meeting is in
  // progress (for anyone), never with a panel, Alfred, the report or the tour open, while typing, mid-swipe or with
  // unsent changes. A quiet moment is switching tabs, 10 seconds without a tap, or putting the app away. The app comes back
  // on the same tab and scroll spot (lt-resume).
  const opened=Date.now(); let applying=false, tapped=false;
  document.addEventListener('pointerdown', ()=>{ tapped=true; S.lastTapAt=Date.now(); }, { capture:true });
  const apply=w=>{ if (applying) return; applying=true;
    try { sessionStorage.setItem('lt-resume', JSON.stringify({ view:S.view, mtab:S.mtab||'', back:S.back||'', y:window.scrollY, at:Date.now() })); } catch(e){}
    w.postMessage({ type:'skip-waiting' }); };
  const quiet=()=>{ const a=document.activeElement;
    return S.data && !S.live && S.view!=='live' && !S.sheet && !S.alf.open && S.coach==null && !document.getElementById('report') && !document.getElementById('signin')
      && !S.touching && !(S.outbox||[]).length && !S.pending && !S.undo && !(a && a.matches && a.matches('input, textarea, select, [contenteditable]')); };
  S.tryUpdate=why=>{ const w=S.updateWaiting; if (!w || applying || !quiet()) return;
    if (why==='tab' || why==='hidden' || Date.now()-(S.lastTapAt||opened)>10000) apply(w); };
  const ready=w=>{
    if (!navigator.serviceWorker.controller) return;   // the very first install: this page is already the newest
    S.updateWaiting=w;
    if (!tapped && Date.now()-opened<4000 && !S.sheet && !S.live) { apply(w); return; }   // just opened: at once
    S.tryUpdate('ready');
  };
  setInterval(()=>S.tryUpdate && S.tryUpdate('idle'), 5000);
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden) S.tryUpdate('hidden'); });

    reg.addEventListener('updatefound', ()=>{ const w=reg.installing; if (w) w.addEventListener('statechange', ()=>{ if (w.state==='installed') ready(w); }); });
    document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
}

  try { if (v) localStorage.setItem('lt-push', JSON.stringify(v)); else localStorage.removeItem('lt-push'); } catch(e){}
}
function isIPhone(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
// 'none' (not offered here), 'install' (iPhone in Safari: add to the Home Screen first), 'denied', 'off' or 'on'.
function pushState(){
  if (!MOCK && !pushCfg()) return 'none';
  if (!MOCK && (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window))) return isIPhone() ? 'install' : 'none';
  if (!MOCK && Notification.permission==='denied') return 'denied';
  return pushSaved() && (MOCK || Notification.permission==='granted') ? 'on' : 'off';
}
function loadJs(src){
  return new Promise((ok,fail)=>{ const sc=document.createElement('script'); sc.src=src; sc.crossOrigin='anonymous'; sc.referrerPolicy='no-referrer';
    sc.onload=ok; sc.onerror=()=>fail(new Error('NetworkError: Connection failure')); document.head.appendChild(sc); });
}
function pushMessaging(){
  if (!pushMessaging.p) {
    pushMessaging.p=loadJs(FIREBASE_JS+'firebase-app-compat.js').then(()=>loadJs(FIREBASE_JS+'firebase-messaging-compat.js')).then(()=>{
      const app=firebase.apps.length ? firebase.app() : firebase.initializeApp(pushCfg().config);
      return firebase.messaging(app);
    });
    pushMessaging.p.catch(()=>{ pushMessaging.p=null; });
  }
  return pushMessaging.p;
}
async function pushToken(){
  if (MOCK) return 'mock-device-token-0123456789';
  const reg=await navigator.serviceWorker.ready, msg=await pushMessaging();
  const tok=await msg.getToken({ vapidKey:pushCfg().vapidKey, serviceWorkerRegistration:reg });
  if (!tok) throw new Error('This device couldn\'t sign up for notifications. Try again.');
  return tok;
}
// Turn On: the permission question has to come straight from the tap, so it's asked before anything loads.
function pushOn(){
  if (S.pushBusy) return;
  let ask;
  try { ask=MOCK || Notification.permission==='granted' ? Promise.resolve('granted') : Promise.resolve(Notification.requestPermission()); } catch(e){ ask=Promise.resolve('default'); }
  if (!MOCK) pushMessaging().catch(()=>{});   // start loading while the question is up
  S.pushBusy=true; render();
  ask.then(p=>{ if (p!=='granted') throw new Error(p==='denied' ? 'push-denied' : 'Notifications weren\'t turned on.'); return pushToken(); })
    .then(tok=>call('apiPushRegister', tok, PUSH_OPTS.map(o=>o[0]), navigator.userAgent).then(r=>{ pushSaved({ token:tok, kinds:r.kinds, me:S.data.me, at:Date.now() }); }))
    .catch(e=>toast(e && e.message==='push-denied' ? 'Notifications are off for Huddle in your phone\'s Settings.' : errText(e)))
    .finally(()=>{ S.pushBusy=false; if (S.view==='settings') render(); });
}
function pushOff(){
  const s=pushSaved(); if (!s) return;
  pushSaved(null); render();
  call('apiPushUnregister', s.token).catch(()=>{});
  if (!MOCK) pushMessaging().then(m=>m.deleteToken()).catch(()=>{});
}
function pushKind(k){
  const s=pushSaved(); if (!s) return;
  const was=s.kinds.slice(), on=s.kinds.indexOf(k)<0;
  s.kinds=on ? s.kinds.concat(k) : s.kinds.filter(x=>x!==k); pushSaved(s); render();
  call('apiPushUpdate', s.token, s.kinds).catch(e=>{ s.kinds=was; pushSaved(s); render(); toast(errText(e)); });
}
// Once a day the app quietly checks that this device's push address hasn't changed (phones renew them now and then).
function pushRefresh(){
  const s=pushSaved();
  if (MOCK || !s || pushState()!=='on' || Date.now()-(s.at||0)<86400000) return;
  pushToken().then(tok=>call('apiPushRegister', tok, s.kinds, navigator.userAgent, tok!==s.token ? s.token : '').then(()=>{   // bug #23
    pushSaved(Object.assign(s, { token:tok, at:Date.now() }));
  })).catch(()=>{});
}
// A tapped notification (sw.js sends its address when Huddle is already open): go to that task, the meeting or the tab.
function openFromPush(url){
  let q; try { q=new URL(url, location.href).searchParams; } catch(e){ return; }
  if (document.getElementById('report')) closeReport();   // Critique 4 (bug #6): nothing covers what the notification opens
  if (S.alf.open) closeAlfred();
  const task=q.get('task'), v=q.get('view');
  if (task) {
    // Nov 16 (#42): Huddle open in the background doesn't have a brand-new task yet: fetch the list, then open it.
    const show=()=>{ if (S.sheet) closeSheet(true); openTask(task); };
    if (find(task)) { show(); return; }
    if (S.outbox.length || !navigator.onLine) { go('mine'); return; }
    call('apiTasks').then(tasks=>{ S.data.tasks=tasks; S.lastSync=Date.now(); saveBoot(); render();
      if (find(task)) show(); else { go('mine'); toast('That task isn\'t available any more.'); } })
      .catch(()=>go('mine'));
    return;
  }
  if (v==='live') { if (S.live) go('live'); else { S.startLive=true; S.liveChecked=0; livePoll(); } return; }
  if (['mine','team','meetings','topics'].indexOf(v)>=0) go(v);
}

function webStart(){
  document.documentElement.classList.add('web');

  load();
}

      else if (op.op==='edit' && it) { ['text','color','done','secs'].forEach(k=>{ if (op[k]!=null) it[k]=op[k]; }); if (op.area!=null) it.area=area(op.area); }
      else if (op.op==='del' || op.op==='park') { const i=g.items.findIndex(x=>x.id===op.id); if (i>=0) { g.gone=(g.gone||[]).concat([{ id:op.id, text:g.items[i].text, how:op.op==='park'?'parked':'removed', by:nameOf(me), at:Date.now(), item:g.items[i], index:i }]); g.items.splice(i,1); } }
      else if (op.op==='restore') { const x=(g.gone||[]).find(y=>y.id===op.id); if (x) { g.gone=g.gone.filter(y=>y!==x); g.items.splice(Math.min(x.index, g.items.length), 0, x.item); } }
      else if (op.op==='area_color') { if (op.color) g.areaColors[op.area]=op.color; else delete g.areaColors[op.area]; }
      else if (op.op==='sugg') { const x=g.sugg.find(y=>y.id===op.id); if (x) x.state=op.state; }
      else if (op.op==='listen') g.listen=op.on ? { by:me, name:nameOf(me), mic:op.mic||'' } : null;
      live.version++; return {state:live, now:Date.now()}; },
    apiSttToken:()=>({ token:'preview', expires_in:60, keyterms:[] }),
    apiLiveListen:(seq,text)=>{ if (!live) return {state:live, now:Date.now()}; const g=live.agenda=live.agenda||{ items:[], areaColors:{}, sugg:[], listen:null, n:0 };
      const A=(S.data.focus||{}), areas=(A.objectives||[]).concat(A.operating||[]);
      String(text).split('\n').forEach(line=>{ const l=line.replace(/^\[S\d+\]\s*/,''), low=l.toLowerCase();
        const color=/\bred\b/.test(low)?'red':/yellow/.test(low)?'yellow':/\bgreen\b/.test(low)?'green':'';
        const ar=areas.find(x=>low.indexOf(x.toLowerCase().split(' (')[0])>=0);
        if (/^i'll |^i will /.test(low)) { g.n++; g.sugg.push({ id:'s'+g.n, kind:'task', text:l.replace(/^I'll /i,'').replace(/\.$/,''), owner:'', due:'', state:'' }); return; }
        if (/agreed|we decided|let's go with/.test(low)) { g.n++; g.sugg.push({ id:'s'+g.n, kind:'decision', text:l.replace(/^So /,'').replace(/\.$/,''), owner:'', due:'', state:'' }); return; }
        if (ar && /nothing to add|this week/.test(low)) { if (color) g.areaColors[ar]=color; return; }
        const m=/(?:under [a-z ]+, |for [a-z ]+, |lightning round, )(.+?)(?:\.|$)/i.exec(l);
        const who={ S1:'Becky', S2:'Dr. Smith', S3:'Jared' }[(/^\[(S\d+)\]/.exec(line)||[])[1]]||'';   // the practice conversation's voices
        if (m) { g.n++; g.items.push({ id:'a'+g.n, text:m[1].replace(/^the /i,'').replace(/ is ready to review/,'').replace(/^\w/, c=>c.toUpperCase()), area:ar||'Lightning Round', color:color, by:who, src:'alfred', done:false, secs:0 }); } });
      live.version++; return {state:live, now:Date.now()}; },
    apiLiveRate:n=>{ if (live) { live.ratings=live.ratings||{}; live.ratings[me]=n; live.version++; } return {state:live, now:Date.now()}; },
    apiSetMotiveNext:v=>v, apiSetConflictNext:v=>v,
    apiLiveMark:(field,key,value,move)=>{ if (live) {
        if (field==='items') { live.items=live.items||[]; if (live.items.indexOf(key)<0) live.items.push(key); }
        else if (field==='review') { live.review=live.review||{}; const prev=live.review[key];
          if (!value) delete live.review[key]; else live.review[key]=Object.assign({}, value, { due_before:prev?prev.due_before:value.due_before, status_before:prev?prev.status_before:value.status_before, by:me, at:today+' 12:00' }); }
        else { live[field]=live[field]||{}; const k=field==='ratings'?me:key; if (value) live[field][k]=field==='ratings'?Number(value):value; else delete live[field][k];
          if (value && move && live.i===move.step && (live.person||0)===move.from) { live.person=move.to; live.personStart=Date.now(); } }
        live.version++; } return {state:live, now:Date.now()}; },
    apiLiveLogs:()=>liveLogs.filter(l=>!l.deleted_at).slice().reverse(),
    apiDeleteLiveLog:id=>Object.assign(liveLogs.find(l=>l.id===id), { deleted_at:today+' 12:00', deleted_by:me }),
    apiRestoreLiveLog:id=>Object.assign(liveLogs.find(l=>l.id===id), { deleted_at:'', deleted_by:'' }),
    apiAdminProcessInbox:()=>alog('Process New Meetings Now','No new meetings were waiting.'),
    apiAdminResetTriggers:()=>alog('Repair Scheduled Jobs','Scheduled jobs in place, running as the operations account: Process new meetings (every 5 minutes); Morning emails (daily, 7am).'),
    apiAdminSwitchToCloudflare:()=>alog('Switch to Cloudflare','Copied 21 tabs (1,240 rows) and 64 settings. Every count matches. Huddle now saves to Cloudflare, and the Sheet gets a copy every 5 minutes.'),
    apiAdminSwitchToGoogle:()=>alog('Switch Back to Google','Back on Google. Checked 21 tabs into the Sheet and copied 64 settings back.'),
    apiAdminConnectCloudflare:()=>alog('Connect to Cloudflare','Connected to https://huddle.example.workers.dev. Cloudflare accepted the password. Next: Copy Data to Cloudflare.'),
    apiAdminCopyToCloudflare:()=>alog('Copy Data to Cloudflare','Copied 21 tabs (1,240 rows) and 64 settings. Every count matches.'),
    apiAdminTestEmail:()=>alog('Send Me a Test Email','Test email sent to '+me+'. 1480 emails left today.'),
    apiAdminAddSample:()=>alog('Load Sample Data','Sample data loaded: 4 meetings, 14 tasks and 2 Parking Lot topics, all marked [Sample].'),
    apiAdminRemoveSample:()=>alog('Remove Sample Data','Sample data removed (38 rows).'),
    apiAlfredCalendarEvent:(t,w,m,n)=>({ id:'ev1', names:(n&&n.length?n:['Brayden']).map(x=>String(x).split(' ')[0]), when:w }), apiAlfredCalendarUndo:()=>({ ok:true }),
    apiAlfredEmailDraft:(to)=>({ sent:(to||['Brayden']).map(x=>String(x).split('@')[0]) }),
    apiTranscribe:()=>({ text:'Please add a task for Erin to call the Curve rep about saving cards on file before Thursday.', secs:6 }),
    apiAlfredChat:(msgs)=>team.alfred_chat==='off' ? {reply:'Alfred chat is turned off right now.',drafts:[],proposals:[]} : alfred(msgs),
    apiSubmitChangeRequest:(draft,ctx,shot)=>{ const r=Object.assign({id:'r'+Date.now(),created_at:today+' 12:00',requested_by:me,has_screenshot:!!shot,status:'New',decided_by:'',decided_at:'',pr_url:'',notes:'',context:ctx}, draft);
      requests.unshift(r); r._shot=shot; return r; },
    apiChangeRequests:()=>requests,
    // Nov 17: Marketing runs in memory in the preview, on the same sample store as Show Sample Data.
    apiMarketing:()=>MK().apiMarketing(me), apiSaveDelivery:d=>MK().apiSaveDelivery(me,d), apiDeleteDelivery:x=>MK().apiDeleteDelivery(me,x),
    apiSavePost:p=>MK().apiSavePost(me,p), apiDeletePost:x=>MK().apiDeletePost(me,x), apiSaveIdea:i=>MK().apiSaveIdea(me,i), apiLikeIdea:x=>MK().apiLikeIdea(me,x),
    apiDeleteIdea:x=>MK().apiDeleteIdea(me,x), apiRestoreMarketing:(k,x)=>MK().apiRestoreMarketing(me,k,x),
    apiChats:()=>chats.filter(c=>c.email===me).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,50).map(c=>({ id:c.id, title:c.title, at:c.at, n:c.msgs.filter(m=>m.role==='user').length })),
    apiChatGet:id=>{ const c=chats.find(x=>x.id===id && x.email===me); if (!c) throw new Error('That chat isn\'t there any more.'); return { id:c.id, title:c.title, at:c.at, msgs:c.msgs }; },
    apiChatSave:list=>{ [].concat(list).forEach(c=>{ const o=chats.find(x=>x.id===c.id); const row={ id:c.id, email:me, title:c.title, at:c.at, msgs:c.msgs }; if (o) Object.assign(o,row); else chats.push(row); }); return { ok:true, saved:[].concat(list).length }; },
    apiChatDelete:id=>{ const i=chats.findIndex(x=>x.id===id && x.email===me); if (i>=0) chats.splice(i,1); return { ok:true }; },
    apiChangeRequestScreenshot:id=>{ const r=requests.find(x=>x.id===id); return (r && r._shot) || fakeShot(); },
    apiDecideChangeRequest:(id,v,note)=>{ const r=requests.find(x=>x.id===id); r.status=v; r.decided_by=me; r.decided_at=today+' 12:00'; if (note) r.notes=(r.notes?r.notes+'\n':'')+'Becky Calia ('+today+'): '+note; return r; },
    apiAdminAlfredUsage:()=>'Alfred chat is '+team.alfred_chat+'.\nThis month: 23 answers from 5 people.\nTokens: 41,200 in, 18,900 out, 512,000 read from cache, 38,000 written to cache.\nEstimated cost: $0.83 (Claude Opus 5.5 list prices; the Claude Console has the exact bill).\nChange requests: '+requests.filter(r=>r.status==='New').length+' waiting for a decision, 0 approved or being built, 0 ready for review, 1 live, 0 declined.',
    apiAdminProblems:()=>({ log:adminLog.slice(-20).reverse(),
      inbox:[{received_at:d(-3)+' 10:42',otter_id:'aB3xY9',error:'SyntaxError: Unexpected end of JSON input',processed_at:d(-3)+' 10:45'}] })
  };
}
